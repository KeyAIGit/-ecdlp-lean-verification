name: Uniform oriented-root circuit boundary

on:
  push:
    branches:
      - research/uorc056-uniform-circuit
      - research/parity-lift-000
    paths:
      - 'Ecdlp/Proved/UniformOrientedRootCircuitBoundary.lean'
      - 'experiments/parity_lift_000/uniform_high_degree_circuit.py'
      - 'experiments/parity_lift_000/oriented_parity_divisor_circuit.py'
      - 'archive/untrusted_intake/parity_lift_000/UNIFORM_ORIENTED_ROOT_CIRCUIT_056_TRACK_C.md'
      - '.github/workflows/uniform-oriented-root-circuit-boundary.yml'
  pull_request:
    branches:
      - research/parity-lift-000
    paths:
      - 'Ecdlp/Proved/UniformOrientedRootCircuitBoundary.lean'
      - 'experiments/parity_lift_000/uniform_high_degree_circuit.py'
      - 'experiments/parity_lift_000/oriented_parity_divisor_circuit.py'
      - 'archive/untrusted_intake/parity_lift_000/UNIFORM_ORIENTED_ROOT_CIRCUIT_056_TRACK_C.md'
      - '.github/workflows/uniform-oriented-root-circuit-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run predecessor frozen oriented-root replay
        run: |
          python3 experiments/parity_lift_000/oriented_parity_divisor_circuit.py \
            --out /tmp/oriented_parity_divisor_circuit_results.json \
            > /tmp/oriented-parity-divisor.log

      - name: Run exact uniform-circuit replay
        run: |
          python3 experiments/parity_lift_000/uniform_high_degree_circuit.py \
            --oriented-root-results /tmp/oriented_parity_divisor_circuit_results.json \
            --out /tmp/uniform_high_degree_circuit_results.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/uniform_high_degree_circuit_results.json').read_text()
          )
          aggregate = data['aggregate']
          assert aggregate['all_binary_programs_replay_exactly']
          assert aggregate['all_high_degree_witnesses_fail_orientation_gate']
          assert aggregate['all_predecessor_parity_certificates_passed']
          assert aggregate['all_predecessor_roots_maximal_degree']
          assert aggregate['predecessor_certificate_count'] == 6
          assert not aggregate['evaluator_found']
          assert not aggregate['parity_oracle_found']
          assert not aggregate['sub_sqrt_ecdlp_found']
          print(json.dumps(aggregate, indent=2))
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/UniformOrientedRootCircuitBoundary.lean; then
            echo '::error::Uniform circuit boundary theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check circuit boundary
        run: lake build Ecdlp.Proved.UniformOrientedRootCircuitBoundary

      - name: Upload exact replay
        uses: actions/upload-artifact@v4
        with:
          name: uniform-high-degree-circuit-results
          path: /tmp/uniform_high_degree_circuit_results.json
