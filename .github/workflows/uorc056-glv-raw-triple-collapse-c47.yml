name: UORC056 GLV raw triple collapse C47

on:
  push:
    branches: [research/uorc056-ward-open-transport-c44]
    paths:
      - 'experiments/parity_lift_000/uorc056_glv_raw_triple_c47.py'
      - 'experiments/parity_lift_000/uorc056_glv_raw_triple_c47_status.json'
      - 'experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py'
      - 'Ecdlp/Proved/Uorc056GlvRawTripleCollapseC47.lean'
      - 'notes/UORC056_GLV_RAW_TRIPLE_COLLAPSE_C47.md'
      - '.github/workflows/uorc056-glv-raw-triple-collapse-c47.yml'
  pull_request:
    branches: [research/uorc056-local-glv-gauge-breaking-c43]
    paths:
      - 'experiments/parity_lift_000/uorc056_glv_raw_triple_c47.py'
      - 'experiments/parity_lift_000/uorc056_glv_raw_triple_c47_status.json'
      - 'experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py'
      - 'Ecdlp/Proved/Uorc056GlvRawTripleCollapseC47.lean'
      - 'notes/UORC056_GLV_RAW_TRIPLE_COLLAPSE_C47.md'
      - '.github/workflows/uorc056-glv-raw-triple-collapse-c47.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and replay C47
        run: |
          python -m py_compile experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py experiments/parity_lift_000/uorc056_glv_raw_triple_c47.py
          PYTHONPATH=experiments/parity_lift_000 python experiments/parity_lift_000/uorc056_glv_raw_triple_c47.py --out /tmp/uorc056_glv_raw_triple_c47_results.json
      - name: Check machine-readable boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/uorc056_glv_raw_triple_c47_results.json').read_text())
          status=json.loads(Path('experiments/parity_lift_000/uorc056_glv_raw_triple_c47_status.json').read_text())
          assert result['profile_id']=='UORC-056-GLV-RAW-TRIPLE-COLLAPSE-C47'
          assert result['aggregate']==status['aggregate']
          assert result['decision']==status['decision']
          aggregate=result['aggregate']
          assert aggregate['toy_curves']==8
          assert aggregate['secp_fixed_instance']==1
          assert aggregate['sampled_scalars']==294
          assert aggregate['point_action_checks']==588
          assert aggregate['first_rotation_checks']==294
          assert aggregate['second_rotation_checks']==294
          assert aggregate['ratio_checks']==588
          assert aggregate['fourier_checks']==882
          assert aggregate['product_checks']==294
          assert aggregate['errors']==0
          decision=result['decision']
          assert decision['glv_raw_triple_publicly_polylog_evaluable']
          assert decision['glv_raw_triple_collapses_to_one_raw_state']
          assert not decision['glv_raw_triple_has_three_independent_coordinates']
          assert not decision['second_independent_open_section_found']
          assert not decision['parity_oracle_found']
          assert not decision['sub_sqrt_ecdlp_found']
          assert result['digest']==status['replay_digest']
          PY
      - name: Install Lean toolchain
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check C47 algebra
        run: |
          lake exe cache get
          lake build Ecdlp.Proved.Uorc056GlvRawTripleCollapseC47
          lake env lean Ecdlp/Proved/Uorc056GlvRawTripleCollapseC47.lean
      - uses: actions/upload-artifact@v4
        with:
          name: uorc056-glv-raw-triple-collapse-c47
          path: /tmp/uorc056_glv_raw_triple_c47_results.json
          retention-days: 90
