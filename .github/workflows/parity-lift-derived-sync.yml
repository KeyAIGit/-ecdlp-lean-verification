name: Parity lift derived sync

on:
  push:
    branches:
      - research/parity-lift-000

permissions:
  contents: write

concurrency:
  group: parity-lift-derived-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[derived-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/parity-lift-000
      - name: Regenerate affected pure artifacts
        run: |
          python3 scripts/gen_stats.py
          python3 scripts/gen_result_registry.py
          python3 scripts/build_knowledge_graph.py
          python3 scripts/gen_status.py
          python3 scripts/export_agent_bundle.py --manifest
          python3 scripts/build_dashboard.py
      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/stats.json \
            data/result_registry.json \
            data/knowledge_graph.json \
            data/knowledge_graph.md \
            STATUS.md \
            bundles/MANIFEST.json \
            dashboard.html \
            index.html
          if git diff --cached --quiet; then
            echo "No derived drift"
          else
            git commit -m "chore: refresh parity-lift derived artifacts [derived-sync] [skip ci]"
            git push origin HEAD:research/parity-lift-000
          fi
