name: CM Weil trace compression

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'experiments/parity_lift_000/cm_weil_trace_compression.py'
      - 'Ecdlp/Proved/CmWeilTraceCompression.lean'
      - '.github/workflows/cm-weil-trace-compression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact CM-Weil trace replay
        run: |
          python3 experiments/parity_lift_000/cm_weil_trace_compression.py \
            --out /tmp/cm_weil_trace_compression_results.json \
            > /tmp/cm-weil-trace-compression.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/cm_weil_trace_compression_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 6
          assert aggregate['total_trace_checks'] == 10656
          assert aggregate['total_determinant_character_checks'] == 10650
          assert aggregate['total_cm_commutation_checks'] == 10656
          assert aggregate['all_exact_trace_compressions']
          assert aggregate['all_collision_union_bounds']
          assert secp['n_mod_12'] == 1
          assert secp['sqrt_n_ceil'] == 2**128
          assert secp['min_affine_forms_for_exact_balanced_generic_decoder'] == 2**128
          assert secp['embedding_degree'] > secp['sqrt_n_ceil']
          assert secp['standard_weil_dimension'] > secp['sqrt_n_ceil']
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/CmWeilTraceCompression.lean; then
            echo '::error::CM-Weil theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check CM-Weil identities
        run: lake build Ecdlp.Proved.CmWeilTraceCompression

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: cm-weil-trace-compression-results
          path: |
            /tmp/cm_weil_trace_compression_results.json
            /tmp/cm-weil-trace-compression.log
          retention-days: 90
