name: Secp factor 13441 within-curve cross-validation

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - experiments/parity_lift_000/secp_13441_character_screen.py
      - experiments/parity_lift_000/secp_13441_within_curve_cv.py
      - Ecdlp/Proved/Secp13441WithinCurveBoundary.lean
      - archive/untrusted_intake/parity_lift_000/SECP_13441_WITHIN_CURVE_CV_024.md
      - .github/workflows/secp-13441-within-curve-cv.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: secp-13441-within-curve-cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install exact and numerical dependencies
        run: python3 -m pip install --disable-pip-version-check numpy sympy

      - name: Run within-curve C6-orbit cross-validation
        run: |
          python3 experiments/parity_lift_000/secp_13441_within_curve_cv.py \
            --out /tmp/secp_13441_within_curve_cv_results.json \
            > /tmp/secp-13441-within.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/secp_13441_within_curve_cv_results.json').read_text()
          )
          print(json.dumps(data['aggregate'], indent=2))
          print(json.dumps(data['variant_summary'], indent=2))
          for row in sorted(
              data['evaluations'], key=lambda item: (item['order'], item['target'], item['lookup'])
          )[-20:]:
              print({
                  'target': row['target'],
                  'lookup': row['lookup'],
                  'order': row['order'],
                  'accuracy': row['observed_accuracy'],
                  'advantage': row['observed_advantage'],
                  'null_q95': row['null_q95_accuracy'],
                  'above_q95': row['strictly_above_null_q95'],
                  'unseen_phase_fraction': row['test_unseen_phase_fraction'],
              })
          if data['aggregate']['admitted_variants']:
              raise SystemExit(
                  'within-curve phase model requires manual review: '
                  + repr(data['aggregate']['admitted_variants'])
              )
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/Secp13441WithinCurveBoundary.lean; then
            echo "::error::Within-curve phase theorem contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check orientation boundary
        run: lake build Ecdlp.Proved.Secp13441WithinCurveBoundary

      - name: Post curve-specific decision to research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path('/tmp/secp_13441_within_curve_cv_results.json').read_text()
          )
          agg = data['aggregate']
          print('## SECP-13441-WITHIN-CURVE-CV-024')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```json')
          print(json.dumps(agg, indent=2))
          print('```')
          print()
          print('| variant | large cases | q95 exceedances | mean accuracy | largest accuracy | largest-two min advantage | admitted |')
          print('|---|---:|---:|---:|---:|---:|---|')
          for name, row in data['variant_summary'].items():
              print(
                  f"| `{name}` | {row['large_cases']} | "
                  f"{row['strict_null_q95_exceedances']} | "
                  f"{row['mean_accuracy']:.6f} | "
                  f"{row['largest_order_accuracy']:.6f} | "
                  f"{row['largest_two_minimum_advantage']:.6f} | "
                  f"{row['admitted_signal']} |"
              )
          print()
          print('Decision: **no same-curve raw or fixed low-pass phase lookup passed disjoint-C6-orbit cross-validation and its balance-preserving permutation null.**')
          print()
          print('Boundary: this is more relevant than cross-curve lookup because training labels may be generated on secp256k1 itself. It still tests only five lookup families, not arbitrary same-curve learning algorithms.')
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload within-curve artifact
        uses: actions/upload-artifact@v4
        with:
          name: secp-13441-within-curve-cv-results
          path: /tmp/secp_13441_within_curve_cv_results.json
          if-no-files-found: error
