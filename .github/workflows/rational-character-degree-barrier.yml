name: Rational character degree barrier

on:
  push:
    branches:
      - research/direct-glv-carry-descent-010
    paths:
      - 'Ecdlp/Proved/RationalCharacterDegreeBarrier.lean'
      - 'experiments/parity_lift_000/rational_character_degree_barrier.py'
      - '.github/workflows/rational-character-degree-barrier.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install numeric replay dependency
        run: python3 -m pip install --disable-pip-version-check mpmath

      - name: Run carry coefficient and degree replay
        run: |
          python3 experiments/parity_lift_000/rational_character_degree_barrier.py \
            --out /tmp/rational_character_degree_barrier_results.json \
            > /tmp/rational-character-degree-barrier.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/rational_character_degree_barrier_results.json').read_text()
          )
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))

          assert aggregate['cases'] == 15
          assert aggregate['total_fourier_formula_checks'] == 15
          assert aggregate['all_angle_sums_equal_pi']
          assert aggregate['all_uniform_one_over_two_pi_bounds']
          assert float(aggregate['maximum_direct_formula_residual']) < 1.0e-70
          assert secp['lambda_angle_sum_is_n']
          assert float(secp['degree_lower_exact_log2']) > 125.3
          assert float(secp['degree_lower_uniform_log2']) > 124.3
          assert float(secp['quotient_R_degree_lower_log2']) > 122.7
          assert secp['secp_subgroup_enumerated'] is False
          PY
          tail -n 100 /tmp/rational-character-degree-barrier.log

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/RationalCharacterDegreeBarrier.lean; then
            echo "::error::Rational degree barrier theorem contains sorry"
            exit 1
          fi

      - name: Install elan with transient-download retries
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Elan installation failed after retries"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check arithmetic lower-bound core
        run: lake build Ecdlp.Proved.RationalCharacterDegreeBarrier

      - name: Post decision to synchronized research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path('/tmp/rational_character_degree_barrier_results.json').read_text()
          )
          secp = data['secp256k1']
          print('## RATIONAL-CHARACTER-DEGREE-BARRIER-033')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```json')
          print(json.dumps(data['aggregate'], indent=2))
          print('```')
          print()
          print('secp256k1 exact-coefficient degree lower bound:')
          print()
          print(f"- `log2 degree > {secp['degree_lower_exact_log2']}`")
          print(f"- quotient `R(x^3)` degree: `log2 r > {secp['quotient_R_degree_lower_log2']}`")
          print()
          print('Decision: **an exact geometrically non-power rational-character carry decoder requires rational-map degree at the square-root scale. High-degree low-size nonlinear circuits remain open.**')
          print()
          print('Successor: `SQUARE-CLASS-CIRCUIT-COMPLEXITY-034`.')
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/373/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload degree-barrier artifact
        uses: actions/upload-artifact@v4
        with:
          name: rational-character-degree-barrier-results
          path: /tmp/rational_character_degree_barrier_results.json
