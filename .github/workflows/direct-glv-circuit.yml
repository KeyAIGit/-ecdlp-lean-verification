name: Direct GLV low-circuit screen

on:
  push:
    branches:
      - research/direct-glv-circuit-011
    paths:
      - experiments/parity_lift_000/direct_glv_carry_descent_screen.py
      - experiments/parity_lift_000/direct_glv_circuit_screen.py
      - experiments/parity_lift_000/direct_glv_circuit_results.json
      - .github/workflows/direct-glv-circuit.yml
  workflow_dispatch:

concurrency:
  group: direct-glv-circuit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install exact screen dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Compile screens
        run: |
          python3 -m py_compile \
            experiments/parity_lift_000/direct_glv_carry_descent_screen.py \
            experiments/parity_lift_000/direct_glv_circuit_screen.py

      - name: Replay frozen low-circuit screen
        run: |
          python3 experiments/parity_lift_000/direct_glv_circuit_screen.py \
            --out /tmp/direct_glv_circuit_results.json \
            > /tmp/direct-glv-circuit.log
          tail -n 100 /tmp/direct-glv-circuit.log

      - name: Compare semantic JSON and scoped gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          replay = json.loads(
              Path('/tmp/direct_glv_circuit_results.json').read_text()
          )
          frozen = json.loads(
              Path(
                  'experiments/parity_lift_000/'
                  'direct_glv_circuit_results.json'
              ).read_text()
          )
          if replay != frozen:
              raise SystemExit('direct GLV low-circuit replay differs')

          aggregate = replay['aggregate']
          for key in (
              'power_affine_up_to_two_exact_decoders_order_at_least_271',
              'shifted_power_exact_decoders_order_at_least_271',
              'sparse_trinomial_exact_decoders_order_at_least_271',
              'monic_cubic_exact_decoders_order_at_least_271',
          ):
              assert aggregate[key] == 0, (key, aggregate[key])
          assert aggregate['nontrivial_cases'] == 12
          assert aggregate['monic_cubic_screened_nontrivial_cases'] == 6
          assert aggregate['largest_quotient_orbits'] == 670
          print('direct GLV low-circuit replay: PASS')
          PY
