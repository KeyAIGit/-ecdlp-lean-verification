name: UORC056 secp256k1 embedding degree

on:
  push:
    branches: [research/uorc056-poly-compression-existence]
    paths:
      - 'scripts/uorc056_secp_embedding_degree.py'
      - 'experiments/uorc056/secp256k1_embedding_degree.json'
      - 'notes/reviews/UORC056_SECP256K1_EMBEDDING_DEGREE_BOUNDARY.md'
      - '.github/workflows/uorc056-secp-embedding-degree.yml'
  pull_request:
    branches: [research/parity-lift-000]
    paths:
      - 'scripts/uorc056_secp_embedding_degree.py'
      - 'experiments/uorc056/secp256k1_embedding_degree.json'
      - 'notes/reviews/UORC056_SECP256K1_EMBEDDING_DEGREE_BOUNDARY.md'
      - '.github/workflows/uorc056-secp-embedding-degree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Replay exact multiplicative-order certificate
        run: |
          python scripts/uorc056_secp_embedding_degree.py --out /tmp/secp256k1_embedding_degree.json
          diff -u experiments/uorc056/secp256k1_embedding_degree.json /tmp/secp256k1_embedding_degree.json
      - name: Check boundary fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('experiments/uorc056/secp256k1_embedding_degree.json').read_text())
          assert data['profile_id']=='UORC-056-SECP256K1-EMBEDDING-DEGREE'
          assert data['status']=='proved_by_exact_order_certificate'
          assert data['embedding_degree']==(data['n']-1)//6
          assert data['embedding_degree_bit_length']==254
          assert data['certificate']['p_to_K_mod_n']==1
          assert all(v!=1 for v in data['certificate']['p_to_K_over_q_mod_n'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uorc056-secp256k1-embedding-degree
          path: /tmp/secp256k1_embedding_degree.json
          retention-days: 90
