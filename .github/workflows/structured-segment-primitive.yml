name: Structured segment primitive tradeoff

on:
  push:
    branches:
      - research/structured-segment-primitive-004
    paths:
      - Ecdlp/Proved/SegmentCheckpointTradeoff.lean
      - experiments/segment_primitive_004/**
      - .github/workflows/structured-segment-primitive.yml
  pull_request:
    paths:
      - Ecdlp/Proved/SegmentCheckpointTradeoff.lean
      - experiments/segment_primitive_004/**
      - .github/workflows/structured-segment-primitive.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt Mathlib cache
        run: lake exe cache get

      - name: Kernel-check checkpoint tradeoff theorems
        run: |
          lake build Ecdlp.Proved.SegmentCheckpointTradeoff
          lake env lean Ecdlp/Proved/SegmentCheckpointTradeoff.lean
          if grep -nE '^[[:space:]]*(sorry|admit)([[:space:]]|$)' \
              Ecdlp/Proved/SegmentCheckpointTradeoff.lean; then
            echo "::error::The proved file contains sorry/admit"
            exit 1
          fi

      - name: Replay frozen checkpoint coverage verifier
        run: |
          python3 experiments/segment_primitive_004/verify_checkpoint_tradeoff.py \
            --out /tmp/checkpoint_tradeoff_results.json
          cmp /tmp/checkpoint_tradeoff_results.json \
            experiments/segment_primitive_004/checkpoint_tradeoff_results.json

      - name: Summarize result
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path(
              "experiments/segment_primitive_004/checkpoint_tradeoff_results.json"
          ).read_text())
          exact = data["exact_exhaustive"]
          sampled = data["deterministic_large_samples"]
          print("## STRUCTURED-SEGMENT-PRIMITIVE-004")
          print()
          print(f"- exact subset/offset pairs: **{exact['subset_offset_pairs_checked']:,}**")
          print(f"- exact covering pairs: **{exact['covering_pairs_checked']:,}**")
          print(f"- sampled larger cases: **{sampled['samples_checked']:,}**")
          print("- decision: checkpoint storage times online offset range covers the order")
          PY
