name: Secp factor 13441 held-out character screen

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - experiments/parity_lift_000/secp_13441_character_screen.py
      - experiments/parity_lift_000/secp_13441_character_runner.py
      - Ecdlp/Proved/Secp13441CharacterBoundary.lean
      - archive/untrusted_intake/parity_lift_000/SECP_13441_CHARACTER_HELDOUT_022.md
      - .github/workflows/secp-13441-character-screen.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: secp-13441-character-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install exact and numerical dependencies
        run: python3 -m pip install --disable-pip-version-check numpy sympy

      - name: Run frozen 13441st-character held-out screen
        run: |
          python3 experiments/parity_lift_000/secp_13441_character_runner.py \
            --out /tmp/secp_13441_character_results.json \
            > /tmp/secp-13441.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/secp_13441_character_results.json').read_text()
          )
          print(json.dumps(data['aggregate'], indent=2))
          print(json.dumps(data['variant_summary'], indent=2))
          for row in data['evaluations']:
              print({
                  'target': row['target'],
                  'orientation': row['orientation'],
                  'lookup': row['lookup'],
                  'test_order': row['test_order'],
                  'accuracy': row['observed_accuracy'],
                  'advantage': row['observed_advantage'],
                  'null_q95': row['null_q95_accuracy'],
                  'above_q95': row['strictly_above_null_q95'],
                  'unseen_bins': row['test_phase_bins_unseen'],
              })
          if data['aggregate']['admitted_variants']:
              raise SystemExit(
                  '13441st-character variant requires manual review: '
                  + repr(data['aggregate']['admitted_variants'])
              )
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/Secp13441CharacterBoundary.lean; then
            echo "::error::Secp 13441 character boundary contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check secp character arithmetic
        run: lake build Ecdlp.Proved.Secp13441CharacterBoundary

      - name: Post held-out decision to research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path('/tmp/secp_13441_character_results.json').read_text()
          )
          agg = data['aggregate']
          print('## SECP-13441-CHARACTER-HELDOUT-022')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```text')
          print('p_secp - 1 = 2 * 3 * 7 * 13441 * q')
          print('phase(Q) = Phi(Q)^((p-1)/13441) in mu_13441')
          print('```')
          print()
          print('```json')
          print(json.dumps(agg, indent=2))
          print('```')
          print()
          print('| variant | tests | q95 exceedances | mean accuracy | largest accuracy | largest-two min advantage | admitted |')
          print('|---|---:|---:|---:|---:|---:|---|')
          for name, row in data['variant_summary'].items():
              print(
                  f"| `{name}` | {row['evaluations']} | "
                  f"{row['strict_null_q95_exceedances']} | "
                  f"{row['mean_accuracy']:.6f} | "
                  f"{row['largest_order_accuracy']:.6f} | "
                  f"{row['largest_two_minimum_advantage']:.6f} | "
                  f"{row['admitted_signal']} |"
              )
          print()
          print('Decision: **no raw or fixed low-pass binary lookup on the public order-13441 point-function phase passed the rolling held-out gate.**')
          print()
          print('Boundary: this tests universal cross-curve binary lookup structure. It does not rule out richer use of the full phase, a secp-specific table, or the remaining large cofactor.')
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload 13441st-character artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secp-13441-character-results
          path: /tmp/secp_13441_character_results.json
          if-no-files-found: error
