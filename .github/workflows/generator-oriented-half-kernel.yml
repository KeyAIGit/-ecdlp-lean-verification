name: Generator-oriented half-kernel covariance

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - "experiments/parity_lift_000/generator_oriented_half_kernel_covariance.py"
      - "Ecdlp/Proved/GeneratorOrientationBlindness.lean"
      - ".github/workflows/generator-oriented-half-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exhaustive frozen covariance audit
        run: |
          python3 experiments/parity_lift_000/generator_oriented_half_kernel_covariance.py \
            --out /tmp/generator_oriented_half_kernel_covariance_results.json \
            > /tmp/generator-oriented-half-kernel.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/generator_oriented_half_kernel_covariance_results.json").read_text()
          )
          print(json.dumps(data["aggregate"], indent=2))
          aggregate = data["aggregate"]
          required = (
              aggregate["all_generator_covariance_exact"]
              and aggregate["all_negation_root_covariance_exact"]
              and aggregate["all_signature_counts_equal_n_minus_1_over_3"]
              and aggregate["all_stabilizers_equal_C3"]
              and aggregate["all_complement_cosets_equal_negative_C3"]
              and aggregate["all_kernel_blind_collisions_witnessed"]
          )
          if not required:
              raise SystemExit("generator-orientation covariance audit failed")
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/GeneratorOrientationBlindness.lean; then
            echo "::error::Generator-orientation theorem contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check generator blindness
        run: lake build Ecdlp.Proved.GeneratorOrientationBlindness

      - name: Post decision to research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("/tmp/generator_oriented_half_kernel_covariance_results.json").read_text()
          )
          aggregate = data["aggregate"]
          print("## GENERATOR-ORIENTED-HALF-KERNEL-027")
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print("```json")
          print(json.dumps(aggregate, indent=2))
          print("```")
          print()
          print(
              "Decision: **kernel-only CM or isogeny data cannot select the "
              "generator-oriented half.** The subgroup is unchanged by "
              "`G -> -G`, while the required factor is complemented."
          )
          print()
          print(
              "The surviving route must add an explicit generator-sensitive "
              "theta/sigma linearization or equivalent dual-character datum. "
              "No carry, R3, parity, or ECDLP decoder is claimed."
          )
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload covariance artifact
        uses: actions/upload-artifact@v4
        with:
          name: generator-oriented-half-kernel-results
          path: /tmp/generator_oriented_half_kernel_covariance_results.json
          if-no-files-found: error
