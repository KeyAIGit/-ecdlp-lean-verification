name: Frobenius orientation obstruction

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'Ecdlp/Proved/FrobeniusOrientationObstruction.lean'
      - 'experiments/parity_lift_000/frobenius_orientation_obstruction.py'
      - 'archive/untrusted_intake/parity_lift_000/FROBENIUS_ORIENTATION_OBSTRUCTION_030.md'
      - '.github/workflows/frobenius-orientation-obstruction.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install exact dependencies
        run: python3 -m pip install --disable-pip-version-check sympy

      - name: Run exact half-Frobenius replay
        run: |
          python3 experiments/parity_lift_000/frobenius_orientation_obstruction.py \
            --out /tmp/frobenius_orientation_obstruction_results.json \
            > /tmp/frobenius-orientation-obstruction.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/frobenius_orientation_obstruction_results.json').read_text())
          print(json.dumps(data['aggregate'], indent=2))
          print(json.dumps(data['secp256k1'], indent=2))
          aggregate = data['aggregate']
          assert aggregate['verified_even_order_cases'] > 0
          assert aggregate['all_half_frobenius_actions_are_negation']
          assert aggregate['frobenius_invariant_carry_decoders'] == 0
          assert data['secp256k1']['half_frobenius_is_negation']
          assert not data['secp256k1']['frobenius_invariant_carry_decoder_possible']
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/FrobeniusOrientationObstruction.lean; then
            echo "::error::Frobenius orientation theorem contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check Frobenius obstruction
        run: lake build Ecdlp.Proved.FrobeniusOrientationObstruction

      - name: Post decision to research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('/tmp/frobenius_orientation_obstruction_results.json').read_text())
          print('## FROBENIUS-ORIENTATION-OBSTRUCTION-030')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```json')
          print(json.dumps(data['aggregate'], indent=2))
          print('```')
          print()
          print('Decision: **ordinary Frobenius-invariant descent cannot decode the anti-invariant GLV carry when half-Frobenius acts as scalar negation.**')
          print()
          print('Successor: `ANTI-FROBENIUS-ORIENTATION-SEED-031`.')
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: frobenius-orientation-obstruction-results
          path: /tmp/frobenius_orientation_obstruction_results.json
