name: UORC056 higher-arity index boundary

on:
  push:
    branches:
      - research/uorc056-kummer-factor
    paths:
      - 'archive/untrusted_intake/parity_lift_000/UORC056_HIGHER_ARITY_INDEX_B5.md'
      - 'experiments/parity_lift_000/uorc056_higher_arity_index.py'
      - 'Ecdlp/Proved/HigherArityIndexBoundary.lean'
      - '.github/workflows/uorc056-higher-arity-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact higher-arity replay
        run: |
          python3 experiments/parity_lift_000/uorc056_higher_arity_index.py \
            --out /tmp/uorc056_higher_arity_index_results.json \
            > /tmp/uorc056-higher-arity-index.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/uorc056_higher_arity_index_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 10
          assert aggregate['root_parameter_checks'] == 49234
          assert aggregate['three_set_covering_checks'] == 5529301
          assert aggregate['all_root_bounds_hold']
          assert aggregate['all_three_set_bounds_hold']
          assert secp['bit_length'] == 256
          assert secp['explicit_root_state_lower_bound'] == 240615969168004511545033772477625056927
          assert secp['no_leftover_child_degree_lower_bound'] == 240615969168004511545033772477625056927
          assert secp['root_bound_bit_length'] == 128
          assert secp['fixed_exponent_is_one_half']
          assert not secp['does_explicit_higher_arity_tree_meet_subroot']
          assert secp['selected_successor'] == 'UORC056-TRANSPOSED-KERNEL-EVALUATION-B6'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/HigherArityIndexBoundary.lean; then
            echo '::error::Higher-arity boundary theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check higher-arity boundary
        run: lake build Ecdlp.Proved.HigherArityIndexBoundary

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-higher-arity-index-results
          path: |
            /tmp/uorc056_higher_arity_index_results.json
            /tmp/uorc056-higher-arity-index.log
          retention-days: 90
