name: UORC056 arithmetic jet independence C48

on:
  push:
    branches: [research/uorc056-ward-open-transport-c44]
    paths:
      - 'experiments/parity_lift_000/uorc056_arithmetic_jet_independence_c48.py'
      - 'experiments/parity_lift_000/uorc056_arithmetic_jet_independence_c48_status.json'
      - 'experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py'
      - 'Ecdlp/Proved/Uorc056ArithmeticJetIndependenceC48.lean'
      - 'notes/UORC056_ARITHMETIC_JET_INDEPENDENCE_C48.md'
      - '.github/workflows/uorc056-arithmetic-jet-independence-c48.yml'
  pull_request:
    branches: [research/uorc056-local-glv-gauge-breaking-c43]
    paths:
      - 'experiments/parity_lift_000/uorc056_arithmetic_jet_independence_c48.py'
      - 'experiments/parity_lift_000/uorc056_arithmetic_jet_independence_c48_status.json'
      - 'experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py'
      - 'Ecdlp/Proved/Uorc056ArithmeticJetIndependenceC48.lean'
      - 'notes/UORC056_ARITHMETIC_JET_INDEPENDENCE_C48.md'
      - '.github/workflows/uorc056-arithmetic-jet-independence-c48.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and replay C48
        run: |
          python -m py_compile \
            experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py \
            experiments/parity_lift_000/uorc056_arithmetic_jet_independence_c48.py
          PYTHONPATH=experiments/parity_lift_000 python \
            experiments/parity_lift_000/uorc056_arithmetic_jet_independence_c48.py \
            --out /tmp/uorc056_arithmetic_jet_independence_c48_results.json
      - name: Check machine-readable boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/uorc056_arithmetic_jet_independence_c48_results.json').read_text())
          status=json.loads(Path('experiments/parity_lift_000/uorc056_arithmetic_jet_independence_c48_status.json').read_text())
          assert result['profile_id']=='UORC-056-ARITHMETIC-JET-INDEPENDENCE-C48'
          assert result['aggregate']==status['aggregate']
          assert result['decision']==status['decision']
          assert result['digest']==status['digest']
          aggregate=result['aggregate']
          assert aggregate['curves']==8
          assert aggregate['scalar_rows']==10086
          assert aggregate['public_jet_checks']==10086
          assert aggregate['torsion_digit_relation_checks']==10086
          assert aggregate['quotient_roots']==1681
          assert aggregate['full_degree_ratio_interpolants']==8
          assert aggregate['dense_ratio_interpolants']==8
          assert aggregate['transferable_affine_character_decoders']==0
          assert aggregate['errors']==0
          decision=result['decision']
          assert decision['arithmetic_jet_publicly_polylog_evaluable']
          assert decision['arithmetic_jet_adds_nonconstant_quotient_state']
          assert decision['ratio_is_compact_high_degree_low_size_state']
          assert not decision['transferable_affine_character_carry_decoder_found']
          assert not decision['public_ordered_sector_evaluator_found']
          assert not decision['parity_oracle_found']
          assert not decision['sub_sqrt_ecdlp_found']
          PY
      - name: Install Lean toolchain
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check C48 algebra
        run: |
          lake exe cache get
          lake build Ecdlp.Proved.Uorc056ArithmeticJetIndependenceC48
          lake env lean Ecdlp/Proved/Uorc056ArithmeticJetIndependenceC48.lean
      - uses: actions/upload-artifact@v4
        with:
          name: uorc056-arithmetic-jet-independence-c48
          path: /tmp/uorc056_arithmetic_jet_independence_c48_results.json
          retention-days: 90
