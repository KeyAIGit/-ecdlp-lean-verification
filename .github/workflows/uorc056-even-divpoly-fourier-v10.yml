name: UORC-056 even divpoly Fourier V10

on:
  push:
    branches:
      - "research/uorc056-execution-001"
    paths:
      - "scripts/uorc056_even_divpoly_fourier_collapse.py"
      - "scripts/test_uorc056_even_divpoly_fourier_collapse.py"
      - "experiments/uorc056/even_divpoly_fourier_collapse_results.json"
      - "notes/reviews/UORC056_EVEN_DIVPOLY_FOURIER_COLLAPSE_V10.md"
      - "scripts/uorc056_eds_decimation_closure.py"
      - "scripts/test_uorc056_eds_decimation_closure.py"
      - "experiments/uorc056/eds_decimation_closure_results.json"
      - "notes/reviews/UORC056_EDS_DECIMATION_CLOSURE_V10.md"
      - "scripts/uorc056_division_polynomial_frontier.py"
      - "experiments/uorc056/divisor_aware_rational_grammar.json"
      - ".github/workflows/uorc056-even-divpoly-fourier-v10.yml"
  pull_request:
    paths:
      - "scripts/uorc056_even_divpoly_fourier_collapse.py"
      - "scripts/test_uorc056_even_divpoly_fourier_collapse.py"
      - "experiments/uorc056/even_divpoly_fourier_collapse_results.json"
      - "notes/reviews/UORC056_EVEN_DIVPOLY_FOURIER_COLLAPSE_V10.md"
      - "scripts/uorc056_eds_decimation_closure.py"
      - "scripts/test_uorc056_eds_decimation_closure.py"
      - "experiments/uorc056/eds_decimation_closure_results.json"
      - "notes/reviews/UORC056_EDS_DECIMATION_CLOSURE_V10.md"
      - "scripts/uorc056_division_polynomial_frontier.py"
      - "experiments/uorc056/divisor_aware_rational_grammar.json"
      - ".github/workflows/uorc056-even-divpoly-fourier-v10.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-fourier-and-ward-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m unittest -v \
            scripts/test_uorc056_even_divpoly_fourier_collapse.py \
            scripts/test_uorc056_eds_decimation_closure.py
      - name: Generate canonical frozen artifacts
        run: |
          python3 scripts/uorc056_even_divpoly_fourier_collapse.py >/dev/null
          python3 scripts/uorc056_eds_decimation_closure.py >/dev/null
      - name: Persist generated artifacts without racing parallel commits
        if: github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "KeyAI CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            experiments/uorc056/even_divpoly_fourier_collapse_results.json \
            experiments/uorc056/eds_decimation_closure_results.json
          if git diff --cached --quiet; then
            echo "Canonical V10 artifacts already committed"
            exit 0
          fi
          git commit -m "UORC-056: persist canonical Fourier and Ward V10 artifacts"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH_NAME}"; then
              exit 0
            fi
            echo "Push raced another commit; rebasing attempt ${attempt}"
            git pull --rebase origin "${BRANCH_NAME}"
          done
          echo "Could not persist V10 artifacts after three attempts" >&2
          exit 1
      - name: Frozen artifact replay
        run: |
          python3 scripts/uorc056_even_divpoly_fourier_collapse.py --check
          python3 scripts/uorc056_eds_decimation_closure.py --check
      - name: Require canonical files on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- experiments/uorc056/even_divpoly_fourier_collapse_results.json experiments/uorc056/eds_decimation_closure_results.json
