name: UORC056 CM recurrence state boundary

on:
  push:
    branches:
      - research/uorc056-kummer-factor
    paths:
      - 'archive/untrusted_intake/parity_lift_000/UORC056_CM_RECURRENCE_STATE_B7.md'
      - 'experiments/parity_lift_000/uorc056_cm_recurrence_state.py'
      - 'Ecdlp/Proved/CmRecurrenceStateBoundary.lean'
      - '.github/workflows/uorc056-cm-recurrence-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact CM spectrum replay
        run: |
          python3 experiments/parity_lift_000/uorc056_cm_recurrence_state.py \
            --out /tmp/uorc056_cm_recurrence_state_results.json \
            > /tmp/uorc056-cm-recurrence-state.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/uorc056_cm_recurrence_state_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 10
          assert aggregate['character_order_checks'] == 1092
          assert aggregate['binary_character_rejections'] == 1092
          assert aggregate['nonzero_parity_fourier_coefficients'] == 1102
          assert aggregate['fourier_closed_form_checks'] == 1102
          assert aggregate['frequency_permutation_checks'] == 4401
          assert aggregate['all_parity_spectra_full']
          assert aggregate['all_parity_targets_noncharacters']
          assert secp['bit_length'] == 256
          assert secp['one_dimensional_nontrivial_character_order'] == secp['n']
          assert secp['nontrivial_binary_characters'] == 0
          assert secp['exact_parity_fourier_support'] == secp['n']
          assert secp['standard_linear_state_dimension_lower_bound'] == secp['n']
          assert not secp['does_bounded_linear_cm_state_select_oriented_root']
          assert secp['selected_successor'] == 'UORC056-NONLINEAR-CM-STATE-B8'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/CmRecurrenceStateBoundary.lean; then
            echo '::error::CM recurrence-state theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check CM recurrence lemmas
        run: lake build Ecdlp.Proved.CmRecurrenceStateBoundary

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-cm-recurrence-state-results
          path: |
            /tmp/uorc056_cm_recurrence_state_results.json
            /tmp/uorc056-cm-recurrence-state.log
          retention-days: 90
