name: Frobenius kernel derivative identity

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - experiments/parity_lift_000/frobenius_kernel_derivative_identity.py
      - .github/workflows/frobenius-kernel-derivative.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run frozen derivative identity check
        run: |
          python3 experiments/parity_lift_000/frobenius_kernel_derivative_identity.py \
            --out frobenius_kernel_derivative_identity_results.json \
            > /tmp/frobenius-kernel-derivative.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('frobenius_kernel_derivative_identity_results.json').read_text())
          print(json.dumps(data['aggregate'], indent=2))
          for case in data['cases']:
              print({
                  'order': case['order'],
                  'degree': case['orbit_polynomial_degree'],
                  'raw_exact': case['exact_up_to_global_sign'],
                  'raw_sign': case['global_sign'],
                  'invariant_exact': case['invariant_derivative_exact_up_to_global_sign'],
                  'invariant_sign': case['invariant_derivative_global_sign'],
              })
          if data['aggregate']['exact_invariant_derivative_identities_up_to_global_sign'] != data['aggregate']['cases']:
              raise SystemExit('predicted invariant derivative identity failed on at least one frozen case')
          PY

      - name: Post verified identity to PR 365
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('frobenius_kernel_derivative_identity_results.json').read_text())
          print('## FROBENIUS-KERNEL-DERIVATIVE-013 verified frozen identity')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```json')
          print(json.dumps(data['aggregate'], indent=2))
          print('```')
          print()
          print('The invariant derivative `3*x^2*P prime(y)` agrees, up to one fixed sign per curve, with the already-public `g*R3` character on every frozen subgroup. Thus the canonical `pi-1` kernel derivative does not separate carry from `R3`.')
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload identity result
        uses: actions/upload-artifact@v4
        with:
          name: frobenius-kernel-derivative-identity
          path: frobenius_kernel_derivative_identity_results.json
