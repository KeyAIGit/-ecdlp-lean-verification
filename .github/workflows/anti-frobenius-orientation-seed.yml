name: Anti-Frobenius orientation seed

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'Ecdlp/Proved/AntiFrobeniusOrientationSeed.lean'
      - 'experiments/parity_lift_000/anti_frobenius_orientation_seed.py'
      - 'archive/untrusted_intake/parity_lift_000/ANTI_FROBENIUS_ORIENTATION_SEED_031.md'
      - '.github/workflows/anti-frobenius-orientation-seed.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run normalized resolvent replay
        run: |
          python3 experiments/parity_lift_000/anti_frobenius_orientation_seed.py \
            --out /tmp/anti_frobenius_orientation_seed_results.json \
            > /tmp/anti-frobenius-orientation-seed.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/anti_frobenius_orientation_seed_results.json').read_text())
          print(json.dumps(data['aggregate'], indent=2))
          print(json.dumps(data['secp256k1'], indent=2))
          aggregate = data['aggregate']
          assert aggregate['total_fixed_line_checks'] == aggregate['total_carry_sign_checks']
          assert aggregate['maximum_imaginary_residual'] < 3.0e-10
          assert aggregate['maximum_glv_residual'] < 3.0e-10
          assert aggregate['maximum_negation_residual'] < 3.0e-10
          assert data['secp256k1']['natural_explicit_quotient_states'] == data['secp256k1']['half_kernel_degree']
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/AntiFrobeniusOrientationSeed.lean; then
            echo "::error::Anti-Frobenius seed theorem contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check anti-invariant line
        run: lake build Ecdlp.Proved.AntiFrobeniusOrientationSeed

      - name: Post decision to research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('/tmp/anti_frobenius_orientation_seed_results.json').read_text())
          print('## ANTI-FROBENIUS-ORIENTATION-SEED-031')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```json')
          print(json.dumps(data['aggregate'], indent=2))
          print('```')
          print()
          print('Decision: **the anti-Frobenius space is a one-dimensional fixed-subfield line, and `A_G(G)` gives an exact normalized carry observable. It still lacks a public sub-square-root evaluation from `Q`.**')
          print()
          print('Successor: `NORMALIZED-PERIOD-BLACKBOX-032`.')
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload normalized resolvent artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-frobenius-orientation-seed-results
          path: /tmp/anti_frobenius_orientation_seed_results.json
