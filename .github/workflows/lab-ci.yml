name: Bootstrap ECDLP lab P01

on:
  push:
    branches:
      - agent/ecdlp-lab-p01-contracts-20260811
    paths:
      - .github/workflows/lab-ci.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble the digest-bound P01 package
        shell: bash
        run: |
          set -euxo pipefail
          PARTS="experiments/ecdlp_lab/fixtures/.bootstrap"
          test "$(find "$PARTS" -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 9
          cat "$PARTS"/part* > "$RUNNER_TEMP/p01.b64"
          echo "01f55dc6f379ce7eaae3db7d13378efd15734a06004591b56fa72c6d07860cdb  $RUNNER_TEMP/p01.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/p01.b64" > "$RUNNER_TEMP/p01.tar.gz"
          echo "fdbb5e5197b38b1c364e4de3daf426f8597f5094f24e7c4a976486b6b0feb4cd  $RUNNER_TEMP/p01.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/p01.tar.gz" -C "$GITHUB_WORKSPACE"
          rm -rf \
            experiments/ecdlp_lab/fixtures/.bootstrap \
            experiments/ecdlp_lab/core/__pycache__ \
            experiments/ecdlp_lab/tests/__pycache__

      - name: Verify P01 before committing it
        shell: bash
        run: |
          set -euxo pipefail
          timeout 60s python3 -m unittest discover \
            -s experiments/ecdlp_lab/tests -v
          python3 experiments/framework/test_framework.py
          python3 scripts/check_repo_artifacts.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          contracts = sorted(Path("experiments/ecdlp_lab/contracts").glob("*.json"))
          assert len(contracts) == 11, len(contracts)
          for path in contracts:
              json.loads(path.read_text(encoding="utf-8"))
          print("validated contract JSON files:", len(contracts))
          PY

      - name: Commit the isolated P01 package
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "KeyAI Lab Bot"
          git config user.email "bekzaddzhanpolatov@gmail.com"
          git add \
            experiments/ecdlp_lab \
            experiments/README.md \
            repo/AUTOMATION_INVENTORY.json
          git diff --cached --check
          git commit -m "feat(lab): implement P01 contracts and canonical JSON"
          git push origin HEAD:${GITHUB_REF_NAME}
