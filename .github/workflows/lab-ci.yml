name: Bootstrap ECDLP lab P01

on:
  push:
    branches:
      - agent/ecdlp-lab-p01-contracts-20260811
    paths:
      - .github/workflows/lab-ci.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and verify the P01 contract package
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/p01.b64" <<'EOF'
[... ELLIPSIZATION ...]
EOF
          base64 --decode "$RUNNER_TEMP/p01.b64" > "$RUNNER_TEMP/p01.tar.gz"
          tar -xzf "$RUNNER_TEMP/p01.tar.gz" -C "$GITHUB_WORKSPACE"
          python3 -m unittest discover -s experiments/ecdlp_lab/tests -v
          python3 experiments/framework/test_framework.py
          python3 scripts/check_repo_artifacts.py

      - name: Commit the isolated P01 package
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "KeyAI Lab Bot"
          git config user.email "bekzaddzhanpolatov@gmail.com"
          git add experiments/ecdlp_lab experiments/README.md repo/AUTOMATION_INVENTORY.json
          git diff --cached --check
          git commit -m "feat(lab): implement P01 contracts and canonical JSON"
          git push origin HEAD:${GITHUB_REF_NAME}
