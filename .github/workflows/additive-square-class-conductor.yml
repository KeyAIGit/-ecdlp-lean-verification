name: Additive square-class conductor

on:
  push:
    branches:
      - research/direct-glv-carry-descent-010
    paths:
      - 'archive/untrusted_intake/parity_lift_000/ADDITIVE_SQUARE_CLASS_CONDUCTOR_039.md'
      - 'experiments/parity_lift_000/additive_square_class_conductor.py'
      - 'Ecdlp/Proved/AdditiveSquareClassConductor.lean'
      - '.github/workflows/additive-square-class-conductor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact conductor stress replay
        run: |
          python3 experiments/parity_lift_000/additive_square_class_conductor.py \
            --out /tmp/additive_square_class_conductor_results.json \
            > /tmp/additive-square-class-conductor.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/additive_square_class_conductor_results.json').read_text()
          )
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['toy_cases'] == 15
          assert aggregate['m_values_per_case'] == 12
          assert (
              aggregate['verified_rows']
              + aggregate['excluded_inseparable_rows']
              == 15 * 12
          )
          assert aggregate['all_verified_overlap_degrees_at_most_three']
          assert aggregate['all_verified_support_bounds_hold']
          assert secp['m'] == 127
          assert secp['separable']
          assert secp['branch_overlap_degree'] == 0
          assert secp['odd_support_degree'] == 2**128
          assert secp['odd_support_exceeds_sqrt_order']
          assert secp['additive_gates'] == 1
          assert secp['total_arithmetic_gates'] == 128
          assert secp['degree_barrier_crossed']
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/AdditiveSquareClassConductor.lean; then
            echo '::error::Additive square-class theorem contains sorry'
            exit 1
          fi

      - name: Install elan with retries
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          for attempt in 1 2 3 4; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo '::error::elan installation failed after retries'
              exit 1
            fi
            rm -rf "$HOME/.elan"
            sleep $((attempt * 3))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check innovation identities
        run: lake build Ecdlp.Proved.AdditiveSquareClassConductor

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: additive-square-class-conductor-results
          path: |
            /tmp/additive_square_class_conductor_results.json
            /tmp/additive-square-class-conductor.log
          retention-days: 90
