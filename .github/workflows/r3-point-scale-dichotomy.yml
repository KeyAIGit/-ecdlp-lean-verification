name: R3 point-scale dichotomy

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - experiments/parity_lift_000/r3_point_scale_dichotomy.py
      - experiments/parity_lift_000/trace_cm_index_section_screen.py
      - Ecdlp/Proved/R3PointScaleDichotomy.lean
      - archive/untrusted_intake/parity_lift_000/R3_POINT_SCALE_DICHOTOMY_018.md
      - .github/workflows/r3-point-scale-dichotomy.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: r3-point-scale-dichotomy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Replay trace and CM-index screen
        run: |
          python3 experiments/parity_lift_000/trace_cm_index_section_screen.py \
            --out /tmp/trace_cm_index_section_results.json \
            > /tmp/trace-cm.log
          tail -n 30 /tmp/trace-cm.log

      - name: Verify point-scale R3 dichotomy
        run: |
          python3 experiments/parity_lift_000/r3_point_scale_dichotomy.py \
            --trace-results /tmp/trace_cm_index_section_results.json \
            --out /tmp/r3_point_scale_dichotomy_results.json \
            > /tmp/r3-dichotomy.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/r3_point_scale_dichotomy_results.json').read_text()
          )
          print(json.dumps(data['aggregate'], indent=2))
          agg = data['aggregate']
          if agg['trace_exact_r3_unexplained'] != 0:
              raise SystemExit('unexplained exact R3 match')
          if agg['trace_exact_r3_carry_equivalent_breakthroughs'] != 0:
              raise SystemExit('hard-branch exact R3 match requires manual review')
          if not agg['exact_matches_iff_point_scale_plus_one']:
              raise SystemExit('exact R3 matches did not equal public branch')
          if not agg['all_point_scale_minus_one_cases_have_no_exact_r3_match']:
              raise SystemExit('s=-1 exact R3 match requires manual review')
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/R3PointScaleDichotomy.lean; then
            echo "::error::R3 point-scale dichotomy contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check R3 dichotomy
        run: lake build Ecdlp.Proved.R3PointScaleDichotomy

      - name: Post corrected R3 classification to research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path('/tmp/r3_point_scale_dichotomy_results.json').read_text()
          )
          agg = data['aggregate']
          print('## R3-POINT-SCALE-DICHOTOMY-018')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```text')
          print('P3(k) = C(k)C(lambda*k)C(lambda^2*k) = s^gamma R3(k)')
          print('s=+1: R3=P3 is already public')
          print('s=-1: R3=carry*P3 is carry-equivalent')
          print('```')
          print()
          print('```json')
          print(json.dumps(agg, indent=2))
          print('```')
          print()
          print('Decision: **all seven exact R3 matches from package 015 are in the public s=+1 branch. No s=-1 carry-equivalent exact R3 match was found.**')
          print()
          print('Corrected gate: an exact R3 match is positive only when the point-scale character is s=-1 and the public C3 norm has been divided out.')
          PY
          gh api \
            --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload R3 triage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r3-point-scale-dichotomy-results
          path: |
            /tmp/trace_cm_index_section_results.json
            /tmp/r3_point_scale_dichotomy_results.json
          if-no-files-found: error
