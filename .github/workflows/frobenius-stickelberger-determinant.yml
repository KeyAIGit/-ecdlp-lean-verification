name: Frobenius-Stickelberger determinant

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'archive/untrusted_intake/parity_lift_000/FROBENIUS_STICKELBERGER_DETERMINANT_050.md'
      - 'experiments/parity_lift_000/frobenius_stickelberger_determinant.py'
      - 'Ecdlp/Proved/FrobeniusStickelbergerDeterminant.lean'
      - '.github/workflows/frobenius-stickelberger-determinant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact determinant-ladder replay
        run: |
          python3 experiments/parity_lift_000/frobenius_stickelberger_determinant.py \
            --out /tmp/frobenius_stickelberger_determinant_results.json \
            > /tmp/frobenius-stickelberger-determinant.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/frobenius_stickelberger_determinant_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 6
          assert aggregate['total_m3_checks'] == 3268
          assert aggregate['total_m4_checks'] == 4698
          assert aggregate['total_m5_checks'] == 4472
          assert aggregate['total_m6_checks'] == 2822
          assert aggregate['total_high_index_four_point_checks'] == 108
          assert aggregate['total_zero_sum_four_point_checks'] == 76
          assert aggregate['total_fixed_character_candidates'] == 18
          assert aggregate['all_standard_determinants_factor']
          assert aggregate['all_standard_basis_constants_are_one']
          assert aggregate['all_fixed_characters_reject_parity']
          assert secp['bit_length'] == 256
          assert secp['valid_for_public_n_dependent_vectors']
          assert not secp['does_standard_determinant_ladder_select_oriented_sqrt']
          assert secp['selected_successor'] == 'INDEPENDENT-THETA-ROW-NORMALIZATION-051'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/FrobeniusStickelbergerDeterminant.lean; then
            echo '::error::Frobenius-Stickelberger theorem core contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check scale-cancellation identities
        run: lake build Ecdlp.Proved.FrobeniusStickelbergerDeterminant

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: frobenius-stickelberger-determinant-results
          path: |
            /tmp/frobenius_stickelberger_determinant_results.json
            /tmp/frobenius-stickelberger-determinant.log
          retention-days: 90
