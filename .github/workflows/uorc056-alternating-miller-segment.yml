name: UORC056 alternating Miller segment

on:
  push:
    branches:
      - research/uorc056-kummer-factor
    paths:
      - 'archive/untrusted_intake/parity_lift_000/UORC056_ALTERNATING_MILLER_SEGMENT_B9.md'
      - 'experiments/parity_lift_000/uorc056_alternating_miller_segment.py'
      - 'Ecdlp/Proved/AlternatingMillerSegment.lean'
      - '.github/workflows/uorc056-alternating-miller-segment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact segment replay
        run: |
          python3 experiments/parity_lift_000/uorc056_alternating_miller_segment.py \
            --out /tmp/uorc056_alternating_miller_segment_results.json \
            > /tmp/uorc056-alternating-miller-segment.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/uorc056_alternating_miller_segment_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 10
          assert aggregate['segment_support_checks'] == 546
          assert aggregate['composition_checks'] == 23793
          assert aggregate['reflected_norm_checks'] == 546
          assert aggregate['all_full_cycles_close']
          assert aggregate['all_midpoint_supports_saturate']
          assert secp['bit_length'] == 256
          assert secp['midpoint_segment_support'] == secp['n']
          assert secp['explicit_segment_divisor_is_linear_size']
          assert secp['compact_norm_determines_only_reflected_quotient']
          assert not secp['endpoint_only_segment_primitive_known']
          assert secp['handoff'] == 'research/uorc056-endpoint-segment'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/AlternatingMillerSegment.lean; then
            echo '::error::Alternating Miller segment theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check segment algebra
        run: lake build Ecdlp.Proved.AlternatingMillerSegment

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-alternating-miller-segment-results
          path: |
            /tmp/uorc056_alternating_miller_segment_results.json
            /tmp/uorc056-alternating-miller-segment.log
          retention-days: 90
