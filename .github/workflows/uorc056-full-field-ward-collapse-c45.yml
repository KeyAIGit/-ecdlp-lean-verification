name: UORC056 full field Ward collapse C45

on:
  push:
    branches: [research/uorc056-ward-open-transport-c44]
    paths:
      - 'experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py'
      - 'experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45_status.json'
      - 'Ecdlp/Proved/Uorc056FullFieldWardCollapseC45.lean'
      - 'notes/UORC056_FULL_FIELD_WARD_COLLAPSE_C45.md'
      - '.github/workflows/uorc056-full-field-ward-collapse-c45.yml'
  pull_request:
    branches: [research/uorc056-local-glv-gauge-breaking-c43]
    paths:
      - 'experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py'
      - 'experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45_status.json'
      - 'Ecdlp/Proved/Uorc056FullFieldWardCollapseC45.lean'
      - 'notes/UORC056_FULL_FIELD_WARD_COLLAPSE_C45.md'
      - '.github/workflows/uorc056-full-field-ward-collapse-c45.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and replay C45
        run: |
          python -m py_compile experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py
          PYTHONPATH=experiments/parity_lift_000 python experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45.py --out /tmp/uorc056_full_field_ward_collapse_c45_results.json
      - name: Check machine-readable boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/uorc056_full_field_ward_collapse_c45_results.json').read_text())
          status=json.loads(Path('experiments/parity_lift_000/uorc056_full_field_ward_collapse_c45_status.json').read_text())
          assert result['profile_id']=='UORC-056-FULL-FIELD-WARD-COLLAPSE-C45'
          aggregate=result['aggregate']
          assert aggregate==status['aggregate']
          assert aggregate['toy_curves']==8
          assert aggregate['sampled_scalars']==294
          assert aggregate['raw_checks']==294
          assert aggregate['full_field_channel_checks']==2352
          assert aggregate['offset_recurrence_checks']==2058
          assert aggregate['canonical_phase_checks']==294
          assert aggregate['errors']==0
          decision=result['decision']
          assert decision==status['decision']
          assert decision['full_field_near_period_family_constructed']
          assert decision['full_field_near_period_family_collapses_to_raw_state']
          assert not decision['varying_ward_offset_adds_independent_information']
          assert not decision['second_independent_open_section_found']
          assert not decision['parity_oracle_found']
          assert not decision['sub_sqrt_ecdlp_found']
          assert result['digest']==status['replay_digest']
          PY
      - name: Install Lean toolchain
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check C45 algebra
        run: |
          lake exe cache get
          lake build Ecdlp.Proved.Uorc056FullFieldWardCollapseC45
          lake env lean Ecdlp/Proved/Uorc056FullFieldWardCollapseC45.lean
      - uses: actions/upload-artifact@v4
        with:
          name: uorc056-full-field-ward-collapse-c45
          path: /tmp/uorc056_full_field_ward_collapse_c45_results.json
          retention-days: 90
