name: UORC056 oriented half-divisor index boundary

on:
  push:
    branches:
      - research/uorc056-kummer-factor
    paths:
      - 'archive/untrusted_intake/parity_lift_000/UORC056_ORIENTED_HALF_DIVISOR_INDEX_B4.md'
      - 'experiments/parity_lift_000/uorc056_oriented_half_divisor_index.py'
      - 'Ecdlp/Proved/OrientedHalfDivisorIndexBoundary.lean'
      - '.github/workflows/uorc056-oriented-half-divisor-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact oriented half-divisor replay
        run: |
          python3 experiments/parity_lift_000/uorc056_oriented_half_divisor_index.py \
            --out /tmp/uorc056_oriented_half_divisor_index_results.json \
            > /tmp/uorc056-oriented-half-divisor-index.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/uorc056_oriented_half_divisor_index_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 10
          assert aggregate['kummer_pairs'] == 546
          assert aggregate['orientation_negation_checks'] == 546
          assert aggregate['index_parameter_checks'] == 49234
          assert aggregate['all_classes_nontrivial_order_n']
          assert aggregate['all_even_odd_x_multisets_equal']
          assert aggregate['all_index_work_bounds_hold']
          assert secp['bit_length'] == 256
          assert secp['class_order'] == secp['n']
          assert secp['standard_two_set_index_work_lower_bound'] == 2**128 - 1
          assert secp['lower_bound_is_2pow128_minus_1']
          assert secp['standard_x_only_index_system_is_generator_blind']
          assert not secp['does_standard_sqrt_velu_meet_fixed_epsilon_subroot']
          assert secp['selected_successor'] == 'UORC056-HIGHER-ARITY-INDEX-B5'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/OrientedHalfDivisorIndexBoundary.lean; then
            echo '::error::Oriented half-divisor theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check index boundary
        run: lake build Ecdlp.Proved.OrientedHalfDivisorIndexBoundary

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-oriented-half-divisor-index-results
          path: |
            /tmp/uorc056_oriented_half_divisor_index_results.json
            /tmp/uorc056-oriented-half-divisor-index.log
          retention-days: 90
