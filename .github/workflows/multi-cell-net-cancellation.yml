name: Multi-cell net cancellation

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'archive/untrusted_intake/parity_lift_000/MULTI_CELL_NET_CANCELLATION_048.md'
      - 'experiments/parity_lift_000/multi_cell_net_cancellation.py'
      - 'Ecdlp/Proved/MultiCellNetCancellation.lean'
      - '.github/workflows/multi-cell-net-cancellation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact multi-cell Ward replay
        run: |
          python3 experiments/parity_lift_000/multi_cell_net_cancellation.py \
            --out /tmp/multi_cell_net_cancellation_results.json \
            > /tmp/multi-cell-net-cancellation.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/multi_cell_net_cancellation_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 6
          assert aggregate['total_ward_minor_checks'] == 1944
          assert aggregate['total_bounded_two_cell_checks'] == 34992
          assert aggregate['total_high_index_two_cell_checks'] == 180
          assert aggregate['total_adjacent_special_checks'] == 1836
          assert aggregate['total_three_cell_rank_two_determinant_checks'] == 15840
          assert aggregate['total_four_index_pluecker_checks'] == 2970
          assert aggregate['all_ward_products_are_rank_two_minors']
          assert aggregate['all_two_cell_determinants_factor']
          assert aggregate['all_three_cell_determinants_vanish']
          assert aggregate['all_pluecker_relations_hold']
          assert secp['bit_length'] == 256
          assert secp['identity_is_index_symbolic']
          assert secp['valid_for_public_n_dependent_indices']
          assert secp['ward_product_representation'] == 'A(a,b)=det((V(a),R(a)),(V(b),R(b)))'
          assert secp['two_cell_determinant_output'] == 'W(m)^2*W(r+s)*W(s-r)'
          assert secp['natural_three_cell_determinant'] == 'identically zero'
          assert secp['four_index_syzygy'] == 'Grassmann-Pluecker relation'
          assert not secp['does_rank_one_ward_minor_grammar_select_oriented_sqrt']
          assert secp['selected_successor'] == 'RANK-TWO-NET-MULTI-CELL-049'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/MultiCellNetCancellation.lean; then
            echo '::error::Multi-cell cancellation theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check multi-cell Ward identities
        run: lake build Ecdlp.Proved.MultiCellNetCancellation

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-cell-net-cancellation-results
          path: |
            /tmp/multi_cell_net_cancellation_results.json
            /tmp/multi-cell-net-cancellation.log
          retention-days: 90
