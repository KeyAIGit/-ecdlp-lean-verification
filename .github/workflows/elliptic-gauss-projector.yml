name: Elliptic Gauss projector

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'archive/untrusted_intake/parity_lift_000/ELLIPTIC_GAUSS_PROJECTOR_035.md'
      - 'experiments/parity_lift_000/elliptic_gauss_projector.py'
      - 'Ecdlp/Proved/EllipticGaussProjector.lean'
      - '.github/workflows/elliptic-gauss-projector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact projector-factor replay
        run: |
          python3 experiments/parity_lift_000/elliptic_gauss_projector.py \
            --out /tmp/elliptic_gauss_projector_results.json \
            > /tmp/elliptic-gauss-projector.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/elliptic_gauss_projector_results.json').read_text())
          aggregate = data['aggregate']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(data['secp256k1'], indent=2))
          assert aggregate['screened_cases'] == 6
          assert aggregate['all_projectors_nonzero']
          assert aggregate['all_first_differing_powers_equal_one']
          assert aggregate['total_generator_change_checks'] > 0
          assert (
              aggregate['total_generator_change_checks']
              == aggregate['total_square_invariance_checks']
          )
          assert (
              data['secp256k1']['quadratic_oriented_factor_degree']
              * 6
              == (data['secp256k1']['order'] - 1) // 2
          )
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/EllipticGaussProjector.lean; then
            echo '::error::Elliptic-Gauss theorem contains sorry'
            exit 1
          fi

      - name: Install elan
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          for attempt in 1 2 3 4; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo '::error::elan installation failed after retries'
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check oriented projector identities
        run: lake build Ecdlp.Proved.EllipticGaussProjector

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: elliptic-gauss-projector-results
          path: |
            /tmp/elliptic_gauss_projector_results.json
            /tmp/elliptic-gauss-projector.log
          retention-days: 90
