name: Elliptic net oriented square root

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'archive/untrusted_intake/parity_lift_000/ELLIPTIC_NET_ORIENTED_SQUARE_ROOT_047.md'
      - 'experiments/parity_lift_000/elliptic_net_oriented_square_root.py'
      - 'Ecdlp/Proved/EllipticNetOrientedSquareRoot.lean'
      - '.github/workflows/elliptic-net-oriented-square-root.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact elliptic-net replay
        run: |
          python3 experiments/parity_lift_000/elliptic_net_oriented_square_root.py \
            --out /tmp/elliptic_net_oriented_square_root_results.json \
            > /tmp/elliptic-net-oriented-square-root.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/elliptic_net_oriented_square_root_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 6
          assert aggregate['total_ward_cell_checks'] == 5320
          assert aggregate['total_near_period_ward_checks'] == 180
          assert aggregate['total_rank_two_determinant_checks'] == 1200
          assert aggregate['total_determinant_character_matches'] == 626
          assert aggregate['total_determinant_character_mismatches'] == 574
          assert aggregate['all_ward_cells_factor']
          assert aggregate['all_coordinate_formulas_exact']
          assert aggregate['all_minimal_determinants_reject_parity']
          assert secp['bit_length'] == 256
          assert secp['ward_cell_identity_valid_for_public_high_indices']
          assert secp['single_recurrence_cell_output'] == 'multiplicative net monomial'
          assert secp['minimal_rank_two_determinant_output'] == 'W(2,2)*W(1,-1)'
          assert not secp['does_single_cell_select_oriented_sqrt']
          assert secp['selected_successor'] == 'MULTI-CELL-NET-CANCELLATION-048'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/EllipticNetOrientedSquareRoot.lean; then
            echo '::error::Elliptic-net determinant theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check determinant collapse identities
        run: lake build Ecdlp.Proved.EllipticNetOrientedSquareRoot

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: elliptic-net-oriented-square-root-results
          path: |
            /tmp/elliptic_net_oriented_square_root_results.json
            /tmp/elliptic-net-oriented-square-root.log
          retention-days: 90
