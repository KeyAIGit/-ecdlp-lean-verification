name: Independent theta row normalization

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'archive/untrusted_intake/parity_lift_000/INDEPENDENT_THETA_ROW_NORMALIZATION_051.md'
      - 'experiments/parity_lift_000/independent_theta_row_normalization.py'
      - 'Ecdlp/Proved/IndependentThetaRowNormalization.lean'
      - '.github/workflows/independent-theta-row-normalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact row-trivialization replay
        run: |
          python3 experiments/parity_lift_000/independent_theta_row_normalization.py \
            --out /tmp/independent_theta_row_normalization_results.json \
            > /tmp/independent-theta-row-normalization.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/independent_theta_row_normalization_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 6
          assert aggregate['total_determinant_factorization_checks'] == 13643
          assert aggregate['total_character_quotient_checks'] == 13498
          assert aggregate['total_same_product_sign_checks'] == 13643
          assert aggregate['total_one_flip_sign_checks'] == 13643
          assert aggregate['all_row_trivializations_factor']
          assert aggregate['all_character_quotients_exact']
          assert aggregate['determinant_sees_only_sign_product']
          assert secp['bit_length'] == 256
          assert secp['residual_after_common_determinant'] == 'product_i(r_i)'
          assert not secp['does_scalar_row_normalization_select_oriented_sqrt']
          assert secp['selected_successor'] == 'TWISTED-THETA-CHARACTERISTIC-052'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/IndependentThetaRowNormalization.lean; then
            echo '::error::Independent row-normalization theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check determinant trivialization identities
        run: lake build Ecdlp.Proved.IndependentThetaRowNormalization

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: independent-theta-row-normalization-results
          path: |
            /tmp/independent_theta_row_normalization_results.json
            /tmp/independent-theta-row-normalization.log
          retention-days: 90
