name: Secp factor 13441 full-phase spectrum

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - experiments/parity_lift_000/secp_13441_character_screen.py
      - experiments/parity_lift_000/secp_13441_phase_spectrum.py
      - Ecdlp/Proved/Secp13441CharacterBoundary.lean
      - Ecdlp/Proved/Secp13441PhaseSpectrumBoundary.lean
      - archive/untrusted_intake/parity_lift_000/SECP_13441_PHASE_SPECTRUM_023.md
      - .github/workflows/secp-13441-phase-spectrum.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: secp-13441-phase-spectrum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install exact and numerical dependencies
        run: python3 -m pip install --disable-pip-version-check numpy sympy

      - name: Audit full complex phase spectrum
        run: |
          python3 experiments/parity_lift_000/secp_13441_phase_spectrum.py \
            --out /tmp/secp_13441_phase_spectrum_results.json \
            > /tmp/secp-13441-phase.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/secp_13441_phase_spectrum_results.json').read_text()
          )
          print(json.dumps(data['aggregate'], indent=2))
          print(json.dumps(data['power_summary'], indent=2))
          for case in sorted(data['cases'], key=lambda row: row['order'])[-4:]:
              print({
                  'p': case['p'],
                  'order': case['order'],
                  'phase_bins': case['phase_bins_seen'],
                  'null_q95': case['null_q95_maximum'],
                  'powers': [
                      {
                          'power': row['power'],
                          'max': row['maximum_nonzero_coefficient'],
                          'max_frequency': row['maximum_frequency'],
                          'times_sqrt': row['coefficient_times_sqrt_order'],
                          'times_log2': row['coefficient_times_log_squared_order'],
                          'above_null': row['strictly_above_null_q95'],
                          'above_invlog2': row['above_inverse_log_squared'],
                      }
                      for row in case['powers']
                  ],
              })
          if data['aggregate']['admitted_powers']:
              raise SystemExit(
                  'full phase power requires manual local-SFT review: '
                  + repr(data['aggregate']['admitted_powers'])
              )
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' \
            Ecdlp/Proved/Secp13441CharacterBoundary.lean \
            Ecdlp/Proved/Secp13441PhaseSpectrumBoundary.lean; then
            echo "::error::Secp 13441 phase theorem contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check phase decimation boundary
        run: |
          lake build Ecdlp.Proved.Secp13441CharacterBoundary
          lake build Ecdlp.Proved.Secp13441PhaseSpectrumBoundary

      - name: Post full-phase decision to research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path('/tmp/secp_13441_phase_spectrum_results.json').read_text()
          )
          agg = data['aggregate']
          print('## SECP-13441-PHASE-SPECTRUM-023')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```text')
          print('Q=[k]G  implies  f_Q(t)=f_G(t*k)')
          print('Fourier(f_Q)(j)=Fourier(f_G)(j*k^(-1))')
          print('```')
          print()
          print('```json')
          print(json.dumps(agg, indent=2))
          print('```')
          print()
          print('| phase power | large cases | null-q95 exceedances | above 1/log | above 1/log^2 | largest coefficient | largest null q95 | admitted |')
          print('|---:|---:|---:|---:|---:|---:|---:|---|')
          for power, row in data['power_summary'].items():
              print(
                  f"| {power} | {row['large_cases']} | "
                  f"{row['null_q95_exceedances']} | "
                  f"{row['cases_above_inverse_log']} | "
                  f"{row['cases_above_inverse_log_squared']} | "
                  f"{row['largest_order_coefficient']:.8f} | "
                  f"{row['largest_order_null_q95']:.8f} | "
                  f"{row['admitted_signal']} |"
              )
          print()
          print('Decision: **none of the eight deterministic full-phase powers passed the matched-null and inverse-log-squared gate.**')
          print()
          print('Boundary: the full phase is stronger than a binary lookup and its decimation identity is exact. This screen does not cover all 13,440 nontrivial phase powers or prove an asymptotic lower bound.')
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload full-phase spectral artifact
        uses: actions/upload-artifact@v4
        with:
          name: secp-13441-phase-spectrum-results
          path: /tmp/secp_13441_phase_spectrum_results.json
          if-no-files-found: error
