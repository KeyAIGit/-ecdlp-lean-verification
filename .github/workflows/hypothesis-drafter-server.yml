name: Draft hypothesis proposals on external host

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Drafting lane"
        required: true
        type: choice
        default: typed_evidence
        options:
          - typed_evidence
          - brainstorm_queue
      model:
        description: "Pinned Featherless model"
        required: true
        type: choice
        default: deepseek-ai/DeepSeek-V4-Flash
        options:
          - deepseek-ai/DeepSeek-V4-Flash
          - deepseek-ai/DeepSeek-V4-Pro
          - moonshotai/Kimi-K2.6
          - zai-org/GLM-5.1
      limit:
        description: "Maximum non-executable proposal fragments"
        required: true
        type: choice
        default: "10"
        options:
          - "5"
          - "10"
          - "20"
          - "30"
      confirmation:
        description: "Type NON_EXECUTABLE_DRAFTS_ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hypothesis-drafter-external-host
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    environment: hypothesis-drafter-production
    timeout-minutes: 45
    steps:
      - name: Validate explicit dispatch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_REF: ${{ github.ref }}
          ENVIRONMENT_READY: ${{ vars.DRAFTER_ENVIRONMENT_READY }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REF" != "refs/heads/main" ]; then
            echo "::error::Secret-bearing drafting is restricted to protected main"
            exit 1
          fi
          if [ "$ENVIRONMENT_READY" != "protected-main-v1" ]; then
            echo "::error::hypothesis-drafter-production is not owner-attested as protected-main-v1"
            exit 1
          fi
          if [ "$CONFIRMATION" != "NON_EXECUTABLE_DRAFTS_ONLY" ]; then
            echo "::error::Confirmation must be NON_EXECUTABLE_DRAFTS_ONLY"
            exit 1
          fi

      - name: Check out the exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the independent dry request plan
        id: plan
        env:
          LANE: ${{ inputs.lane }}
          MODEL: ${{ inputs.model }}
          LIMIT: ${{ inputs.limit }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error::Source commit is not an ancestor of protected main"
            exit 1
          fi
          python3 scripts/hypothesis_model_drafter.py \
            --provider featherless \
            --lane "$LANE" \
            --model "$MODEL" \
            --limit "$LIMIT" \
            --source-commit "$COMMIT_SHA" \
            --output expected-drafts.json
          REQUEST_COUNT="$(python3 -c \
            'import json; print(json.load(open("expected-drafts.json"))["request_count"])')"
          echo "request_count=$REQUEST_COUNT" >> "$GITHUB_OUTPUT"

      - name: Materialize the zero-request batch locally
        if: ${{ steps.plan.outputs.request_count == '0' }}
        run: |
          set -euo pipefail
          mkdir -p remote-drafter-output
          cp expected-drafts.json remote-drafter-output/drafts.json
          printf '%s\n' \
            '{"schema_version":"0.1","status":"skipped_no_eligible_seed"}' \
            > remote-drafter-output/probe.json

      - name: Validate external-host secrets
        if: ${{ steps.plan.outputs.request_count != '0' }}
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          FEATHERLESS_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$FEATHERLESS_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::SERVER_HOST, SERVER_KNOWN_HOSTS, SSH_PRIVATE_KEY, and FEATHERLESS_API_KEY are required"
            exit 1
          fi

      - name: Install SSH key
        if: ${{ steps.plan.outputs.request_count != '0' }}
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Provision the Featherless key without logging it
        if: ${{ steps.plan.outputs.request_count != '0' }}
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SUSER: ${{ secrets.SERVER_USER }}
          FEATHERLESS_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          U="${SUSER:-root}"
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            "$U@$HOST" \
            "umask 077; mkdir -p '.keyai-drafter/$RUN_KEY'; cat > '.keyai-drafter/$RUN_KEY/featherless.key'" \
            <<< "$FEATHERLESS_KEY"

      - name: Probe Featherless and draft the bounded review queue
        if: ${{ steps.plan.outputs.request_count != '0' }}
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SUSER: ${{ secrets.SERVER_USER }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          LANE: ${{ inputs.lane }}
          MODEL: ${{ inputs.model }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          U="${SUSER:-root}"
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            "$U@$HOST" bash -s -- "$RUN_KEY" "$COMMIT_SHA" "$LANE" "$MODEL" "$LIMIT" <<'REMOTE'
          set -euo pipefail
          RUN_KEY="$1"
          COMMIT_SHA="$2"
          LANE="$3"
          MODEL="$4"
          LIMIT="$5"
          BASE="$HOME/.keyai-drafter/$RUN_KEY"
          REPO="$BASE/repo"
          trap 'rm -f "$BASE/featherless.key"' EXIT
          rm -rf "$REPO"
          git clone --quiet --filter=blob:none \
            https://github.com/KeyAIGit/-ecdlp-lean-verification.git "$REPO"
          git -C "$REPO" fetch --quiet origin "$COMMIT_SHA"
          git -C "$REPO" checkout --quiet --detach "$COMMIT_SHA"
          export FEATHERLESS_API_KEY="$(cat "$BASE/featherless.key")"
          python3 "$REPO/scripts/hypothesis_model_drafter.py" \
            --provider featherless \
            --lane "$LANE" \
            --model "$MODEL" \
            --limit "$LIMIT" \
            --source-commit "$COMMIT_SHA" \
            --output "$BASE/drafts.json"
          REQUEST_COUNT="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["request_count"])' \
            "$BASE/drafts.json")"
          if [ "$REQUEST_COUNT" -eq 0 ]; then
            printf '%s\n' \
              '{"schema_version":"0.1","status":"skipped_no_eligible_seed"}' \
              > "$BASE/probe.json"
          else
            python3 "$REPO/scripts/featherless_api_probe.py" \
              --model "$MODEL" --output "$BASE/probe.json"
            export HYPOTHESIS_DRAFTER_LIVE=1
            set +e
            python3 "$REPO/scripts/hypothesis_model_drafter.py" \
              --provider featherless \
              --lane "$LANE" \
              --model "$MODEL" \
              --limit "$LIMIT" \
              --source-commit "$COMMIT_SHA" \
              --live \
              --output "$BASE/drafts.json"
            DRAFTER_RC="$?"
            set -e
            if [ "$DRAFTER_RC" -ne 0 ]; then
              if [ ! -s "$BASE/drafts.json" ]; then
                exit "$DRAFTER_RC"
              fi
              COMPLETION_STATUS="$(python3 -c \
                'import json,sys; print(json.load(open(sys.argv[1]))["completion_status"])' \
                "$BASE/drafts.json")"
              if [ "$COMPLETION_STATUS" != "partial_provider_failure" ]; then
                exit "$DRAFTER_RC"
              fi
            fi
          fi
          REMOTE

      - name: Retrieve sanitized probe and untrusted drafts
        if: ${{ steps.plan.outputs.request_count != '0' }}
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SUSER: ${{ secrets.SERVER_USER }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          U="${SUSER:-root}"
          mkdir -p remote-drafter-output
          retrieve_bounded() {
            NAME="$1"
            MAX_BYTES="$2"
            timeout 120s ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              "$U@$HOST" "cat -- '.keyai-drafter/$RUN_KEY/$NAME'" \
              | head -c "$((MAX_BYTES + 1))" \
              > "remote-drafter-output/$NAME"
            ACTUAL_BYTES="$(stat -c '%s' "remote-drafter-output/$NAME")"
            if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
              echo "::error::$NAME exceeds its bounded transfer limit"
              exit 1
            fi
          }
          retrieve_bounded probe.json 1048576
          retrieve_bounded drafts.json 134217728

      - name: Summarize the non-executable batch
        id: verify
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DRAFT_BYTES="$(stat -c '%s' remote-drafter-output/drafts.json)"
          PROBE_BYTES="$(stat -c '%s' remote-drafter-output/probe.json)"
          if [ "$DRAFT_BYTES" -gt 134217728 ] || [ "$PROBE_BYTES" -gt 1048576 ]; then
            echo "::error::Retrieved external-host artifact exceeds its byte bound"
            exit 1
          fi
          (cd remote-drafter-output && sha256sum drafts.json > drafts.local.sha256)
          python3 - <<'PY'
          import base64
          import json
          import hashlib
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from hypothesis_model_drafter import (
              POLICY_PATH,
              classify_http_error,
              classify_provider_failure_message,
              load_json,
              parse_fragment,
              parse_provider_response_body,
              provider_metadata_problems,
              strict_json_loads,
          )

          probe = strict_json_loads(
              Path("remote-drafter-output/probe.json").read_text()
          )
          drafts = strict_json_loads(
              Path("remote-drafter-output/drafts.json").read_text()
          )
          expected = strict_json_loads(Path("expected-drafts.json").read_text())
          policy = load_json(POLICY_PATH)
          expected_batch_fields = {
              "schema_version", "status", "lane", "input_provenance_bound",
              "provider", "model", "source_commit", "source_tree_clean",
              "source_main_ancestor", "provider_transport_attested", "live", "request_count",
              "requests", "responses", "errors", "completion_status",
              "completed_response_count", "error_count", "scientific_outcomes", "ranker_labels",
              "admissible", "recommended", "authorized", "route_promotions",
              "exact_target_execution", "any_output_executable",
          }
          if set(drafts) != expected_batch_fields:
              raise SystemExit("draft batch fields escaped the closed schema")
          if drafts.get("status") != "untrusted_non_executing_draft_batch":
              raise SystemExit("drafter status escaped the non-executing boundary")
          if drafts.get("provider") != "featherless":
              raise SystemExit("unexpected provider")
          if drafts.get("source_commit") != os.environ["COMMIT_SHA"]:
              raise SystemExit("batch source commit does not match github.sha")
          if drafts.get("source_tree_clean") is not True:
              raise SystemExit("draft batch was not built from a clean source tree")
          if drafts.get("source_main_ancestor") is not True:
              raise SystemExit("draft batch is not anchored to protected main")
          if drafts.get("provider_transport_attested") is not False:
              raise SystemExit("unsigned provider transport cannot be attested")
          lane = drafts.get("lane")
          if lane not in {"typed_evidence", "brainstorm_queue"}:
              raise SystemExit("unexpected drafting lane")
          if drafts.get("input_provenance_bound") != (lane == "typed_evidence"):
              raise SystemExit("drafting lane provenance identity drifted")
          request_count = drafts.get("request_count")
          if type(request_count) is not int or not 0 <= request_count <= 30:
              raise SystemExit("request count escaped the bounded policy")
          for field in (
              "lane",
              "input_provenance_bound",
              "provider",
              "model",
              "source_commit",
              "source_tree_clean",
              "source_main_ancestor",
              "provider_transport_attested",
              "request_count",
              "requests",
          ):
              if drafts.get(field) != expected.get(field):
                  raise SystemExit(
                      f"external host changed independently generated field: {field}"
                  )
          if request_count == 0:
              if (
                  probe.get("status") != "skipped_no_eligible_seed"
                  or drafts.get("live") is not False
                  or drafts.get("completion_status") != "dry_plan"
              ):
                  raise SystemExit("zero-request batch attempted a live model call")
          elif (
              probe.get("status") != "ready"
              or drafts.get("live") is not True
              or drafts.get("completion_status")
              not in {"complete", "partial_provider_failure"}
          ):
              raise SystemExit("live drafting has an invalid completion state")
          for field in (
              "scientific_outcomes",
              "ranker_labels",
              "admissible",
              "recommended",
              "authorized",
              "route_promotions",
          ):
              if type(drafts.get(field)) is not int or drafts.get(field) != 0:
                  raise SystemExit(f"{field} must remain zero")
          if (
              drafts.get("exact_target_execution") is not False
              or drafts.get("any_output_executable") is not False
          ):
              raise SystemExit("execution boundary escaped")
          responses = drafts.get("responses", [])
          errors = drafts.get("errors", [])
          if not isinstance(responses, list) or not isinstance(errors, list):
              raise SystemExit("response/error collections are invalid")
          completed_count = drafts.get("completed_response_count")
          error_count = drafts.get("error_count")
          if (
              type(completed_count) is not int
              or type(error_count) is not int
              or completed_count != len(responses)
              or error_count != len(errors)
              or len(responses) + len(errors) != request_count
          ):
              raise SystemExit("request outcomes do not form an exact partition")
          if drafts.get("completion_status") == "complete" and errors:
              raise SystemExit("complete batch contains provider errors")
          if (
              drafts.get("completion_status") == "partial_provider_failure"
              and not errors
          ):
              raise SystemExit("partial batch contains no provider error")
          if any(
              item.get("authorization") != "none"
              or item.get("executable") is not False
              for item in responses
          ):
              raise SystemExit("a response escaped the non-executable boundary")
          required = policy["output_contract"]["required_fields"]
          prohibited = policy["output_contract"]["prohibited_claims"]
          request_by_inference = {
              item["inference_request_sha256"]: item
              for item in drafts["requests"]
          }
          if len(request_by_inference) != request_count:
              raise SystemExit("request inference identities are not unique")
          seen_inference_requests = set()
          expected_response_fields = {
              "scientific_packet_sha256", "inference_request_sha256",
              "raw_response_sha256", "raw_response",
              "provider_response_sha256", "provider_response_body",
              "provider_metadata", "provider_problems",
              "provider_transport_attested", "fragment", "schema_problems",
              "authorization", "executable",
          }
          for response in responses:
              request = request_by_inference.get(
                  response.get("inference_request_sha256")
              )
              if request is None:
                  raise SystemExit("response does not resolve to a request")
              if set(response) != expected_response_fields:
                  raise SystemExit("provider response fields escaped the closed schema")
              if response.get("scientific_packet_sha256") != request.get(
                  "scientific_packet_sha256"
              ):
                  raise SystemExit("response scientific-packet binding mismatch")
              if response.get("inference_request_sha256") != request.get(
                  "inference_request_sha256"
              ):
                  raise SystemExit("response inference-request binding mismatch")
              inference_digest = response["inference_request_sha256"]
              if inference_digest in seen_inference_requests:
                  raise SystemExit("duplicate inference response")
              seen_inference_requests.add(inference_digest)
              if response.get("provider_transport_attested") is not False:
                  raise SystemExit("provider transport attestation was fabricated")
              raw = response.get("raw_response")
              body = response.get("provider_response_body")
              if not isinstance(raw, str) or not isinstance(body, str):
                  raise SystemExit("response lacks replayable raw provider data")
              if hashlib.sha256(raw.encode()).hexdigest() != response.get(
                  "raw_response_sha256"
              ):
                  raise SystemExit("raw response digest mismatch")
              if hashlib.sha256(body.encode()).hexdigest() != response.get(
                  "provider_response_sha256"
              ):
                  raise SystemExit("provider response digest mismatch")
              provider_content, provider_metadata = parse_provider_response_body(body)
              if provider_content != raw:
                  raise SystemExit("provider body/content mismatch")
              if provider_metadata != response.get("provider_metadata"):
                  raise SystemExit("provider body/metadata mismatch")
              provider_problems = provider_metadata_problems(
                  provider_metadata, requested_model=drafts["model"]
              )
              if provider_problems != response.get("provider_problems"):
                  raise SystemExit("provider metadata findings mismatch")
              fragment, problems = parse_fragment(
                  raw,
                  required,
                  prohibited,
                  allowed_evidence_claim_ids=request[
                      "allowed_evidence_claim_ids"
                  ],
                  provenance_bound=request["input_provenance_bound"],
              )
              problems.extend(provider_problems)
              if fragment != response.get("fragment"):
                  raise SystemExit("external host changed parsed fragment")
              if problems != response.get("schema_problems"):
                  raise SystemExit("external host changed schema findings")
          expected_error_fields = {
              "scientific_packet_sha256", "inference_request_sha256",
              "attempted", "classification", "error_type", "authorization",
              "error_message", "error_message_sha256", "error_message_size_bytes",
              "http_status", "error_body", "error_body_base64", "error_body_sha256",
              "error_body_size_bytes", "error_body_truncated", "executable",
          }
          for error in errors:
              if set(error) != expected_error_fields:
                  raise SystemExit("provider error fields escaped the closed schema")
              request = request_by_inference.get(
                  error.get("inference_request_sha256")
              )
              if request is None:
                  raise SystemExit("provider error does not resolve to a request")
              if (
                  error.get("scientific_packet_sha256")
                  != request.get("scientific_packet_sha256")
                  or error.get("authorization") != "none"
                  or error.get("executable") is not False
                  or not isinstance(error.get("attempted"), bool)
                  or not isinstance(error.get("classification"), str)
                  or not isinstance(error.get("error_type"), str)
              ):
                  raise SystemExit("provider error binding is invalid")
              status = error.get("http_status")
              error_message = error.get("error_message")
              message_digest = error.get("error_message_sha256")
              message_size = error.get("error_message_size_bytes")
              error_body = error.get("error_body")
              error_body_base64 = error.get("error_body_base64")
              error_digest = error.get("error_body_sha256")
              error_size = error.get("error_body_size_bytes")
              truncated = error.get("error_body_truncated")
              if not isinstance(truncated, bool):
                  raise SystemExit("provider error truncation flag is invalid")
              if error.get("attempted"):
                  if (
                      not isinstance(error_message, str)
                      or not isinstance(message_digest, str)
                      or type(message_size) is not int
                  ):
                      raise SystemExit("attempted provider error lacks a replayable message")
                  encoded_message = error_message.encode("utf-8")
                  if (
                      len(encoded_message) != message_size
                      or hashlib.sha256(encoded_message).hexdigest() != message_digest
                  ):
                      raise SystemExit("provider error message digest mismatch")
              elif any(
                  value is not None
                  for value in (error_message, message_digest, message_size)
              ):
                  raise SystemExit("unattempted request fabricated an error message")
              if status is None:
                  if any(
                      value is not None
                      for value in (
                          error_body, error_body_base64, error_digest, error_size
                      )
                  ) or truncated:
                      raise SystemExit("non-HTTP error fabricated HTTP evidence")
                  if error.get("attempted") and classify_provider_failure_message(
                      error_message
                  ) != error.get("classification"):
                      raise SystemExit("non-HTTP error classification is not replayable")
                  if (
                      not error.get("attempted")
                      and (
                          error.get("classification")
                          != "not_attempted_after_prior_failure"
                          or error.get("error_type")
                          != "NotAttemptedAfterPriorFailure"
                      )
                  ):
                      raise SystemExit("unattempted error disposition is invalid")
              else:
                  if (
                      type(status) is not int
                      or not isinstance(error_body, str)
                      or not isinstance(error_body_base64, str)
                      or not isinstance(error_digest, str)
                      or type(error_size) is not int
                  ):
                      raise SystemExit("HTTP error evidence is incomplete")
                  try:
                      raw_error = base64.b64decode(
                          error_body_base64, validate=True
                      )
                  except (ValueError, TypeError) as exc:
                      raise SystemExit("HTTP error body is not strict base64") from exc
                  if (
                      len(raw_error) != error_size
                      or hashlib.sha256(raw_error).hexdigest() != error_digest
                      or raw_error.decode("utf-8", errors="replace") != error_body
                  ):
                      raise SystemExit("HTTP error evidence digest mismatch")
                  replayed_classification = (
                      "provider_response_too_large"
                      if truncated
                      else classify_http_error(status, error_body)
                  )
                  if replayed_classification != error.get("classification"):
                      raise SystemExit("HTTP error classification is not replayable")
              inference_digest = error["inference_request_sha256"]
              if inference_digest in seen_inference_requests:
                  raise SystemExit("duplicate request outcome")
              seen_inference_requests.add(inference_digest)
          if seen_inference_requests != set(request_by_inference):
              raise SystemExit("request outcome coverage is incomplete")
          schema_clear = sum(not item.get("schema_problems") for item in responses)
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## External-host hypothesis drafting\n\n")
              handle.write(f"- Probe status: `{probe.get('status')}`\n")
              handle.write(f"- Lane: `{lane}`\n")
              handle.write(f"- Input provenance-bound: `{drafts.get('input_provenance_bound')}`\n")
              handle.write(f"- Model: `{drafts.get('model')}`\n")
              handle.write(f"- Responses: `{len(responses)}`\n")
              handle.write(f"- Provider errors/skips: `{len(errors)}`\n")
              handle.write(f"- Completion status: `{drafts.get('completion_status')}`\n")
              handle.write(f"- Schema-clear fragments: `{schema_clear}`\n")
              handle.write("- Schema-clear does not imply evidence support or scientific validity.\n")
              handle.write("- Provider transport is retained but not cryptographically attested.\n")
              handle.write("- Scientific outcomes / ranker labels: `0 / 0`\n")
              handle.write("- Admissible / recommended / authorized: `0 / 0 / 0`\n")
              handle.write("- Output remains untrusted and non-executable.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  "provider_failure="
                  + ("true" if drafts.get("completion_status") == "partial_provider_failure" else "false")
                  + "\n"
              )
          PY

      - name: Remove the remote run directory
        if: ${{ always() && steps.plan.outputs.request_count != '0' }}
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SUSER: ${{ secrets.SERVER_USER }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          U="${SUSER:-root}"
          if [ -n "$HOST" ]; then
            ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              "$U@$HOST" "rm -rf '.keyai-drafter/$RUN_KEY'" || true
          fi

      - name: Remove local SSH credentials
        if: ${{ always() && steps.plan.outputs.request_count != '0' }}
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload the non-executable batch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hypothesis-drafter-${{ github.run_id }}-${{ github.run_attempt }}
          path: remote-drafter-output/
          if-no-files-found: error
          retention-days: 14

      - name: Fail after retaining a partial provider batch
        if: ${{ steps.verify.outputs.provider_failure == 'true' }}
        run: |
          echo "::error::One or more provider calls failed; partial batch retained"
          exit 1
