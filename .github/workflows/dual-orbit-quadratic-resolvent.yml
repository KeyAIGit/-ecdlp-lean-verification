name: Dual-orbit quadratic resolvent

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'archive/untrusted_intake/parity_lift_000/DUAL_ORBIT_QUADRATIC_RESOLVENT_034.md'
      - 'experiments/parity_lift_000/dual_orbit_quadratic_resolvent.py'
      - 'Ecdlp/Proved/DualOrbitQuadraticResolvent.lean'
      - '.github/workflows/dual-orbit-quadratic-resolvent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact quadratic-orbit replay
        run: |
          python3 experiments/parity_lift_000/dual_orbit_quadratic_resolvent.py \
            --out /tmp/dual_orbit_quadratic_resolvent_results.json \
            > /tmp/dual-orbit-quadratic-resolvent.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/dual_orbit_quadratic_resolvent_results.json').read_text())
          aggregate = data['aggregate']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(data['secp256k1'], indent=2))
          assert aggregate['screened_cases'] == 6
          assert aggregate['all_x3_projectors_nonzero']
          assert aggregate['all_lower_glv_incompatible_power_sums_zero']
          assert aggregate['all_two_orbit_values_distinct']
          assert aggregate['total_projector_reindex_checks'] > 0
          assert (
              aggregate['total_projector_reindex_checks']
              == aggregate['total_quadratic_orbit_mapping_checks']
          )
          assert data['secp256k1']['order_mod_12'] == 1
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/DualOrbitQuadraticResolvent.lean; then
            echo '::error::Quadratic-resolvent theorem contains sorry'
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check projector identities
        run: lake build Ecdlp.Proved.DualOrbitQuadraticResolvent

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: dual-orbit-quadratic-resolvent-results
          path: |
            /tmp/dual_orbit_quadratic_resolvent_results.json
            /tmp/dual-orbit-quadratic-resolvent.log
          retention-days: 90
