name: UORC056 oriented transposed resultant C42

on:
  push:
    branches: [research/uorc056-oriented-transposed-resultant-c42]
  pull_request:
    paths:
      - 'experiments/parity_lift_000/uorc056_c42_*.py'
      - 'experiments/parity_lift_000/uorc056_oriented_transposed_resultant_c42.py'
      - 'experiments/parity_lift_000/test_uorc056_oriented_transposed_resultant_c42.py'
      - 'Ecdlp/Proved/Uorc056OrientedTransposedResultant.lean'
      - 'notes/UORC056_ORIENTED_TRANSPOSED_RESULTANT_C42.md'
      - '.github/workflows/uorc056-oriented-transposed-resultant-c42.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile, test and replay C42
        run: |
          python -m py_compile \
            experiments/parity_lift_000/uorc056_c42_glv_transposed_resultant.py \
            experiments/parity_lift_000/uorc056_c42_antifrobenius_minor.py \
            experiments/parity_lift_000/uorc056_oriented_transposed_resultant_c42.py \
            experiments/parity_lift_000/test_uorc056_oriented_transposed_resultant_c42.py
          PYTHONPATH=experiments/parity_lift_000 python -m unittest -v \
            experiments/parity_lift_000/test_uorc056_oriented_transposed_resultant_c42.py
          PYTHONPATH=experiments/parity_lift_000 python \
            experiments/parity_lift_000/uorc056_oriented_transposed_resultant_c42.py \
            --out /tmp/uorc056_oriented_transposed_resultant_c42_result.json

      - name: Check machine-readable boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path(
              '/tmp/uorc056_oriented_transposed_resultant_c42_result.json'
          ).read_text())
          assert result['profile_id'] == 'UORC-056-ORIENTED-TRANSPOSED-RESULTANT-C42'
          aggregate = result['aggregate']
          assert aggregate['curves'] == 6
          assert aggregate['relative_norm_targets'] == 498
          assert aggregate['localized_branch_checks'] == 498
          assert aggregate['antifrobenius_character_candidates'] == 59544
          assert aggregate['antifrobenius_character_survivors'] == 0
          assert aggregate['errors'] == 0
          decision = result['decision']
          assert decision['exact_query_root_localization_found']
          assert decision['exact_glv_cubic_relative_norm_found']
          assert decision['antifrobenius_minor_affine_character_grammar_closed']
          assert not decision['cheap_parity_decoder_found']
          assert not decision['parity_oracle_found']
          assert not decision['sub_sqrt_ecdlp_found']
          assert len(result['digest']) == 64
          PY

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
            fi
          fi
          if [ "$installed" = 0 ]; then
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Kernel-check C42 algebra and secp arithmetic
        run: |
          lake exe cache get
          lake build Ecdlp.Proved.Uorc056OrientedTransposedResultant
          lake env lean Ecdlp/Proved/Uorc056OrientedTransposedResultant.lean

      - uses: actions/upload-artifact@v4
        with:
          name: uorc056-oriented-transposed-resultant-c42
          path: /tmp/uorc056_oriented_transposed_resultant_c42_result.json
          retention-days: 90
