name: Generic cocycle integration lower bound

on:
  push:
    branches:
      - research/generic-cocycle-integration-003
    paths:
      - Ecdlp/Proved/CocycleQueryAmbiguity.lean
      - experiments/cocycle_integration_003/**
      - .github/workflows/generic-cocycle-integration.yml
  pull_request:
    paths:
      - Ecdlp/Proved/CocycleQueryAmbiguity.lean
      - experiments/cocycle_integration_003/**
      - .github/workflows/generic-cocycle-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt Mathlib cache
        run: lake exe cache get

      - name: Build imports and kernel-check the query ambiguity theorem
        run: |
          lake build Ecdlp.Proved.CocycleQueryAmbiguity
          lake env lean Ecdlp/Proved/CocycleQueryAmbiguity.lean
          if grep -nE '^[[:space:]]*(sorry|admit)([[:space:]]|$)' \
              Ecdlp/Proved/CocycleQueryAmbiguity.lean; then
            echo "::error::The proved file contains sorry/admit"
            exit 1
          fi

      - name: Replay the frozen finite verifier
        run: |
          python3 experiments/cocycle_integration_003/verify_query_ambiguity.py \
            --out /tmp/query_ambiguity_results.json
          cmp /tmp/query_ambiguity_results.json \
            experiments/cocycle_integration_003/query_ambiguity_results.json

      - name: Summarize result
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path(
              "experiments/cocycle_integration_003/query_ambiguity_results.json"
          ).read_text())
          exact = data["exact_exhaustive"]
          sampled = data["deterministic_large_samples"]
          print("## GENERIC-COCYCLE-INTEGRATION-003")
          print()
          print(f"- exact query sets checked: **{exact['query_sets_checked']:,}**")
          print(f"- exact cut instances: **{exact['cut_instances']}**")
          print(f"- sampled transcripts checked: **{sampled['query_transcripts_checked']:,}**")
          print(f"- ambiguous sampled transcripts: **{sampled['ambiguous_transcripts_witnessed']:,}**")
          print("- decision: exact black-box integration must cover one whole side of the cut")
          PY
