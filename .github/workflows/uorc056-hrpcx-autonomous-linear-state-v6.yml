name: UORC056 H-RPCX autonomous linear-state barrier V6

on:
  push:
    branches: [research/uorc056-hrpcx-linear-shift-barrier]
    paths:
      - 'experiments/parity_lift_000/uorc056_hrpcx_autonomous_linear_state_barrier_v6.py'
      - 'experiments/parity_lift_000/uorc056_hrpcx_autonomous_linear_state_barrier_v6_status.json'
      - 'notes/reviews/UORC056_HRPCX_AUTONOMOUS_LINEAR_STATE_BARRIER_V6.md'
      - '.github/workflows/uorc056-hrpcx-autonomous-linear-state-v6.yml'
  pull_request:
    branches: [research/uorc056-poly-compression-existence]
    paths:
      - 'experiments/parity_lift_000/uorc056_hrpcx_autonomous_linear_state_barrier_v6.py'
      - 'experiments/parity_lift_000/uorc056_hrpcx_autonomous_linear_state_barrier_v6_status.json'
      - 'notes/reviews/UORC056_HRPCX_AUTONOMOUS_LINEAR_STATE_BARRIER_V6.md'
      - '.github/workflows/uorc056-hrpcx-autonomous-linear-state-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Replay multiplicative-order and state bounds
        run: |
          python -m py_compile experiments/parity_lift_000/uorc056_hrpcx_autonomous_linear_state_barrier_v6.py
          python experiments/parity_lift_000/uorc056_hrpcx_autonomous_linear_state_barrier_v6.py --out /tmp/uorc056_hrpcx_autonomous_linear_state_barrier_v6_results.json
      - name: Check exact claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/uorc056_hrpcx_autonomous_linear_state_barrier_v6_results.json').read_text())
          status = json.loads(Path('experiments/parity_lift_000/uorc056_hrpcx_autonomous_linear_state_barrier_v6_status.json').read_text())

          assert result['profile_id'] == status['profile_id']
          assert result['status'] == status['status']
          secp = result['secp256k1']
          expected = status['secp256k1']
          assert secp['embedding_degree'] == expected['embedding_degree']
          assert secp['embedding_degree_bit_length'] == 254
          assert secp['order_certificate']['p_to_K_mod_n'] == 1
          assert all(value != 1 for value in secp['order_certificate']['p_to_K_over_q_mod_n'].values())
          assert secp['state_lower_bounds']['linear_state_over_Fp_dimension_at_least'] == expected['linear_state_over_Fp_dimension_at_least']
          assert secp['state_lower_bounds']['affine_state_over_Fp_dimension_at_least'] == expected['affine_state_over_Fp_dimension_at_least']
          assert secp['state_lower_bounds']['mobius_state_extension_degree_at_least'] == expected['mobius_state_extension_degree_at_least']
          assert result['aggregate']['covered_instances'] == 7
          assert result['aggregate']['excluded_anomalous_instances'] == 2
          assert result['decision'] == status['decision']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uorc056-hrpcx-autonomous-linear-state-v6
          path: /tmp/uorc056_hrpcx_autonomous_linear_state_barrier_v6_results.json
          retention-days: 90
