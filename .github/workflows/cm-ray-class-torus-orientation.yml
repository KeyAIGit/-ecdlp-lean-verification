name: CM ray-class torus orientation

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'experiments/parity_lift_000/cm_ray_class_torus_orientation.py'
      - 'Ecdlp/Proved/CmRayClassTorusOrientation.lean'
      - '.github/workflows/cm-ray-class-torus-orientation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact ray-class resolvent replay
        run: |
          python3 experiments/parity_lift_000/cm_ray_class_torus_orientation.py \
            --out /tmp/cm_ray_class_torus_orientation_results.json \
            > /tmp/cm-ray-class-torus-orientation.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/cm_ray_class_torus_orientation_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 6
          assert aggregate['all_base_resolvents_nonzero']
          assert aggregate['total_c6_invariance_checks'] == 63936
          assert aggregate['total_resolvent_scaling_checks'] == 10656
          assert aggregate['total_trace_invariance_checks'] == 10656
          assert aggregate['total_square_invariance_checks'] == 10656
          assert aggregate['all_s3_equals_six_resolvent']
          assert secp['n_mod_12'] == 1
          assert secp['ceil_sqrt_n'] == 2**128
          assert secp['ray_class_order'] == (secp['n'] - 1) // 6
          assert secp['quadratic_half_orbit'] == (secp['n'] - 1) // 12
          assert secp['direct_resolvent_terms'] > secp['ceil_sqrt_n']
          assert secp['c6_quotient_polynomial_degree_lower_bound'] > secp['ceil_sqrt_n']
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/CmRayClassTorusOrientation.lean; then
            echo '::error::CM ray-class theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check ray-class identities
        run: lake build Ecdlp.Proved.CmRayClassTorusOrientation

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: cm-ray-class-torus-orientation-results
          path: |
            /tmp/cm_ray_class_torus_orientation_results.json
            /tmp/cm-ray-class-torus-orientation.log
          retention-days: 90
