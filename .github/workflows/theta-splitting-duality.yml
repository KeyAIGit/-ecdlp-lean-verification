name: Theta splitting duality

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'Ecdlp/Proved/ThetaSplittingDuality.lean'
      - 'experiments/parity_lift_000/theta_splitting_duality.py'
      - 'archive/untrusted_intake/parity_lift_000/THETA_SPLITTING_DUALITY_028.md'
      - '.github/workflows/theta-splitting-duality.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install exact dependencies
        run: python3 -m pip install --disable-pip-version-check sympy

      - name: Run exact finite-group and GLV replay
        run: |
          python3 experiments/parity_lift_000/theta_splitting_duality.py \
            --out /tmp/theta_splitting_duality_results.json \
            > /tmp/theta-splitting-duality.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/theta_splitting_duality_results.json').read_text())
          print(json.dumps(data['aggregate'], indent=2))
          print(json.dumps(data['secp256k1'], indent=2))
          assert data['aggregate']['all_nonzero_toy_exponents_faithful']
          assert data['aggregate']['all_binary_character_counts_one']
          assert data['aggregate']['carry_character_decoders'] == 0
          assert data['secp256k1']['binary_character_count'] == 1
          assert not data['secp256k1']['intermediate_nontrivial_character_order_exists']
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/ThetaSplittingDuality.lean; then
            echo "::error::Theta splitting duality theorem contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check duality core
        run: lake build Ecdlp.Proved.ThetaSplittingDuality

      - name: Post decision to research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('/tmp/theta_splitting_duality_results.json').read_text())
          print('## THETA-SPLITTING-DUALITY-028')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```json')
          print(json.dumps(data['aggregate'], indent=2))
          print('```')
          print()
          print('Decision: **a standard generator-sensitive splitting is either trivial or differs by a faithful order-n dual character; no nontrivial binary homomorphic quotient exists on the odd prime-order subgroup.**')
          print()
          print('Successor: `GLV-TRIPLE-CUT-EVALUATOR-029`, which asks for a genuinely nonlinear direct evaluation of the known carry cut without evaluating the full character.')
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: theta-splitting-duality-results
          path: /tmp/theta_splitting_duality_results.json
