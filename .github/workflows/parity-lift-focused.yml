name: Parity-lift focused verification

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - Ecdlp/Proved/GlvNormalizationRigidity.lean
      - Ecdlp/Proved/GlvNormalizationRigidityScope.lean
      - Ecdlp/Proved/EisensteinRootPhaseBoundary.lean
      - Ecdlp/Proved/GlobalMonodromyBoundary.lean
      - experiments/parity_lift_000/glv_normalization_rigidity_screen.py
      - experiments/parity_lift_000/glv_normalization_rigidity_results.json
      - experiments/parity_lift_000/global_monodromy_embedding_degree.py
      - .github/workflows/parity-lift-focused.yml
  workflow_dispatch:

concurrency:
  group: parity-lift-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Replay frozen rigidity screen
        run: |
          python3 experiments/parity_lift_000/glv_normalization_rigidity_screen.py \
            --out /tmp/glv_normalization_rigidity_results.json > /tmp/rigidity-screen.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          replay = json.loads(Path('/tmp/glv_normalization_rigidity_results.json').read_text())
          frozen = json.loads(Path(
              'experiments/parity_lift_000/glv_normalization_rigidity_results.json'
          ).read_text())

          differences = []
          def walk(left, right, path='$'):
              if type(left) is not type(right):
                  differences.append((path, left, right))
                  return
              if isinstance(left, dict):
                  for key in sorted(set(left) | set(right)):
                      if key not in left:
                          differences.append((f'{path}.{key}', '<missing>', right[key]))
                      elif key not in right:
                          differences.append((f'{path}.{key}', left[key], '<missing>'))
                      else:
                          walk(left[key], right[key], f'{path}.{key}')
              elif isinstance(left, list):
                  if len(left) != len(right):
                      differences.append((f'{path}.length', len(left), len(right)))
                  for index, (litem, ritem) in enumerate(zip(left, right)):
                      walk(litem, ritem, f'{path}[{index}]')
              elif left != right:
                  differences.append((path, left, right))

          walk(replay, frozen)
          if differences:
              print('semantic rigidity replay differences:')
              for path, replay_value, frozen_value in differences[:100]:
                  print(f'  {path}: replay={replay_value!r} frozen={frozen_value!r}')
              raise SystemExit(1)
          print('semantic rigidity replay: PASS')
          PY
          tail -n 20 /tmp/rigidity-screen.log

      - name: Verify exact monodromy embedding-degree certificate
        run: |
          python3 experiments/parity_lift_000/global_monodromy_embedding_degree.py \
            > /tmp/global-monodromy.log
          tail -n 40 /tmp/global-monodromy.log

      - name: Reject incomplete focused proofs
        run: |
          if grep -nI 'sorry' \
            Ecdlp/Proved/GlvNormalizationRigidity.lean \
            Ecdlp/Proved/GlvNormalizationRigidityScope.lean \
            Ecdlp/Proved/GlobalMonodromyBoundary.lean; then
            echo "::error::Focused parity-lift proof contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check rigidity and monodromy modules
        run: |
          lake build Ecdlp.Proved.GlvNormalizationRigidity
          lake build Ecdlp.Proved.GlvNormalizationRigidityScope
          lake build Ecdlp.Proved.EisensteinRootPhaseBoundary
          lake build Ecdlp.Proved.GlobalMonodromyBoundary
