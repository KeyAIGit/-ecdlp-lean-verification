name: Canonical midpoint circularity

on:
  push:
    branches:
      - research/canonical-midpoint-circularity-005
    paths:
      - Ecdlp/Proved/CanonicalMidpointCircularity.lean
      - experiments/canonical_midpoint_005/**
      - .github/workflows/canonical-midpoint-circularity.yml
  pull_request:
    paths:
      - Ecdlp/Proved/CanonicalMidpointCircularity.lean
      - experiments/canonical_midpoint_005/**
      - .github/workflows/canonical-midpoint-circularity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt Mathlib cache
        run: lake exe cache get

      - name: Kernel-check canonical midpoint theorems
        run: |
          lake build Ecdlp.Proved.CanonicalMidpointCircularity
          lake env lean Ecdlp/Proved/CanonicalMidpointCircularity.lean
          if grep -nE '^[[:space:]]*(sorry|admit)([[:space:]]|$)' \
              Ecdlp/Proved/CanonicalMidpointCircularity.lean; then
            echo "::error::The proved file contains sorry/admit"
            exit 1
          fi

      - name: Replay frozen arithmetic verifier
        run: |
          python3 experiments/canonical_midpoint_005/verify_midpoint_circularity.py \
            --out /tmp/midpoint_circularity_results.json
          cmp /tmp/midpoint_circularity_results.json \
            experiments/canonical_midpoint_005/midpoint_circularity_results.json

      - name: Summarize result
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path(
              "experiments/canonical_midpoint_005/midpoint_circularity_results.json"
          ).read_text())
          split = data["binary_split"]
          half = data["odd_cycle_half"]
          print("## CANONICAL-MIDPOINT-CIRCULARITY-005")
          print()
          print(f"- candidate binary splits: **{split['candidate_splits_checked']:,}**")
          print(f"- odd-cycle scalar cases: **{half['scalar_cases_checked']:,}**")
          print("- decision: canonical midpoint selection determines the parity correction")
          PY
