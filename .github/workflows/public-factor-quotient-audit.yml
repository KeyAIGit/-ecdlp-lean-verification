name: Public factor quotient audit

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - experiments/parity_lift_000/public_factor_quotient_audit.py
      - experiments/parity_lift_000/trace_cm_index_section_screen.py
      - experiments/parity_lift_000/point_function_integer_orientation_screen.py
      - experiments/parity_lift_000/seventh_character_point_function_screen.py
      - Ecdlp/Proved/R3PointScaleDichotomy.lean
      - Ecdlp/Proved/PublicFactorQuotientAudit.lean
      - archive/untrusted_intake/parity_lift_000/PUBLIC_FACTOR_QUOTIENT_AUDIT_021.md
      - .github/workflows/public-factor-quotient-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: public-factor-quotient-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Replay trace and CM-index family
        run: |
          python3 experiments/parity_lift_000/trace_cm_index_section_screen.py \
            --out /tmp/trace_cm_index_section_results.json \
            > /tmp/trace-cm.log
          tail -n 20 /tmp/trace-cm.log

      - name: Replay point-function orientation family
        run: |
          python3 experiments/parity_lift_000/point_function_integer_orientation_screen.py \
            --out /tmp/point_function_integer_orientation_results.json \
            > /tmp/point-function.log
          tail -n 20 /tmp/point-function.log

      - name: Replay held-out seventh-character family
        run: |
          python3 experiments/parity_lift_000/seventh_character_point_function_screen.py \
            --out /tmp/seventh_character_point_function_results.json \
            > /tmp/seventh-character.log
          tail -n 20 /tmp/seventh-character.log

      - name: Apply quotient-qualified admission audit
        run: |
          python3 experiments/parity_lift_000/public_factor_quotient_audit.py \
            --trace-results /tmp/trace_cm_index_section_results.json \
            --point-results /tmp/point_function_integer_orientation_results.json \
            --seventh-results /tmp/seventh_character_point_function_results.json \
            --out /tmp/public_factor_quotient_audit_results.json \
            > /tmp/quotient-audit.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/public_factor_quotient_audit_results.json').read_text()
          )
          print(json.dumps(data['aggregate'], indent=2))
          print(json.dumps(data['family_summaries'], indent=2))
          agg = data['aggregate']
          if agg['admitted_routes']:
              raise SystemExit(
                  'quotient-qualified route requires manual review: '
                  + repr(agg['admitted_routes'])
              )
          if not agg['all_exact_r3_matches_explained_by_public_factor']:
              raise SystemExit('unexplained exact R3 match')
          if not agg['trace_public_r3_orders_equal_scale_plus_orders']:
              raise SystemExit('trace exact R3/public branch mismatch')
          if not agg['point_public_r3_orders_equal_scale_plus_orders']:
              raise SystemExit('point exact R3/public branch mismatch')
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' \
            Ecdlp/Proved/R3PointScaleDichotomy.lean \
            Ecdlp/Proved/PublicFactorQuotientAudit.lean; then
            echo "::error::Public factor quotient theorem contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check quotient theorem
        run: |
          lake build Ecdlp.Proved.R3PointScaleDichotomy
          lake build Ecdlp.Proved.PublicFactorQuotientAudit

      - name: Post quotient-qualified decision to PR 365
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path('/tmp/public_factor_quotient_audit_results.json').read_text()
          )
          agg = data['aggregate']
          print('## PUBLIC-FACTOR-QUOTIENT-AUDIT-021')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```json')
          print(json.dumps(agg, indent=2))
          print('```')
          print()
          for family, summary in data['family_summaries'].items():
              print(f"### `{family}`")
              print()
              print('```json')
              print(json.dumps(summary, indent=2))
              print('```')
              print()
          print('Decision: **no route survives public-factor quotienting, the scale floor, repeated large-case gates, and held-out seventh-character validation.**')
          print()
          print('The seven exact R3 matches in each main family occur exactly on the s=+1 public branch. The hard s=-1 branch has zero exact matches.')
          PY
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload quotient audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-factor-quotient-audit-results
          path: |
            /tmp/trace_cm_index_section_results.json
            /tmp/point_function_integer_orientation_results.json
            /tmp/seventh_character_point_function_results.json
            /tmp/public_factor_quotient_audit_results.json
          if-no-files-found: error
