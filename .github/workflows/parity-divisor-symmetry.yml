name: Parity divisor symmetry

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'experiments/parity_lift_000/parity_divisor_symmetry.py'
      - 'Ecdlp/Proved/ParityDivisorSymmetry.lean'
      - '.github/workflows/parity-divisor-symmetry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact parity-symmetry replay
        run: |
          python3 experiments/parity_lift_000/parity_divisor_symmetry.py \
            --out /tmp/parity_divisor_symmetry_results.json \
            > /tmp/parity-divisor-symmetry.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/parity_divisor_symmetry_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 7
          assert aggregate['total_c6_orbits'] == 402
          assert aggregate['all_preserving_sets_trivial']
          assert aggregate['all_swapping_sets_negation']
          assert aggregate['all_c6_orbits_three_three']
          assert aggregate['all_glv_actions_mix_parity']
          assert secp['lambda_order_three']
          assert secp['lambda_not_plus_or_minus_one']
          assert secp['four_times_even_sum_mod_n'] == secp['n'] - 1
          assert secp['even_set_size'] == (secp['n'] - 1) // 2
          assert secp['parity_rational_degree_lower_bound'] == (secp['n'] - 1) // 2
          assert secp['selected_successor'] == 'ORIENTED-PARITY-DIVISOR-CIRCUIT-046'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/ParityDivisorSymmetry.lean; then
            echo '::error::Parity symmetry theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check parity symmetry identities
        run: lake build Ecdlp.Proved.ParityDivisorSymmetry

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: parity-divisor-symmetry-results
          path: |
            /tmp/parity_divisor_symmetry_results.json
            /tmp/parity-divisor-symmetry.log
          retention-days: 90
