name: UORC056 endpoint factorial equivalence

on:
  push:
    branches:
      - research/uorc056-kummer-factor
    paths:
      - 'archive/untrusted_intake/parity_lift_000/UORC056_ENDPOINT_FACTORIAL_EQUIVALENCE_B14.md'
      - 'experiments/parity_lift_000/uorc056_endpoint_factorial_equivalence.py'
      - 'Ecdlp/Proved/EndpointFactorialEquivalence.lean'
      - '.github/workflows/uorc056-endpoint-factorial-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact cyclic-model replay
        run: |
          python3 experiments/parity_lift_000/uorc056_endpoint_factorial_equivalence.py \
            --out /tmp/uorc056_endpoint_factorial_equivalence_results.json \
            > /tmp/uorc056-endpoint-factorial-equivalence.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/uorc056_endpoint_factorial_equivalence_results.json').read_text()
          )
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert data['package'] == 'UORC056-ENDPOINT-FACTORIAL-EQUIVALENCE-B14'
          assert aggregate['cases'] == 5
          assert aggregate['endpoint_composition_checks'] == 44103
          assert aggregate['segment_product_checks'] == 1916
          assert aggregate['hilbert90_checks'] == 87
          assert aggregate['all_anchor_rows_reconstruct_endpoints']
          assert aggregate['all_recurrence_nullities_one']
          assert aggregate['all_kernel_vectors_dense']
          assert aggregate['all_two_level_bounds_hold']
          assert secp['bit_length'] == 256
          assert secp['endpoint_evaluator_and_global_factor_are_equivalent']
          assert secp['standard_explicit_trace_or_circulant_state_is_linear']
          assert not secp['standard_two_level_product_is_strict_subroot']
          assert secp['two_level_cost_lower_bound_bit_length'] == 129
          assert secp['central_target'] == 'UNIFORM-ORIENTED-ROOT-CIRCUIT-056'
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/EndpointFactorialEquivalence.lean; then
            echo '::error::Endpoint/factorial theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check endpoint equivalence
        run: lake build Ecdlp.Proved.EndpointFactorialEquivalence

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-endpoint-factorial-equivalence-results
          path: |
            /tmp/uorc056_endpoint_factorial_equivalence_results.json
            /tmp/uorc056-endpoint-factorial-equivalence.log
          retention-days: 90
