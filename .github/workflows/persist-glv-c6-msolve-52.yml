name: Persist GLV C6 msolve 52 artifact

on:
  push:
    branches:
      - research/glv-c6-relative-norm-intake-20260811
    paths:
      - .github/workflows/persist-glv-c6-msolve-52.yml

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout intake branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify the completed 52-system artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: "9119474335"
          ARTIFACT_SHA256: "051d132852b739aa7f814af9f54c2c09a65e105b4a82d1007bf9cdac5bfc3e63"
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/glv-msolve-all-52.zip"
          echo "${ARTIFACT_SHA256}  $RUNNER_TEMP/glv-msolve-all-52.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/glv-msolve-all-52"
          unzip -q "$RUNNER_TEMP/glv-msolve-all-52.zip" -d "$RUNNER_TEMP/glv-msolve-all-52"
          test -f "$RUNNER_TEMP/glv-msolve-all-52/combined_summary.json"
          test -f "$RUNNER_TEMP/glv-msolve-all-52/combined_summary.csv"
          test -f "$RUNNER_TEMP/glv-msolve-all-52/RESULTS.md"
          test -d "$RUNNER_TEMP/glv-msolve-all-52/raw_shards"

      - name: Materialize permanent repository evidence
        env:
          ARTIFACT_ID: "9119474335"
          ARTIFACT_SHA256: "051d132852b739aa7f814af9f54c2c09a65e105b4a82d1007bf9cdac5bfc3e63"
          RUN_ID: "31537739286"
          WORKFLOW_HEAD_SHA: "ee1c70e8915b24c4b6a71bbf9c65f07ef701b570"
          INPUT_ARCHIVE_SHA256: "6e96df7baa54536d868bcb7894e047e49a2e737471563e2e22cf27b9607cd5c0"
        shell: bash
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/glv-msolve-all-52"
          DEST="archive/untrusted_intake/GLV-C6-RELATIVE-NORM-2026-08-11/msolve_52"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$SRC/combined_summary.json" "$DEST/combined_summary.json"
          cp "$SRC/combined_summary.csv" "$DEST/combined_summary.csv"
          cp "$SRC/RESULTS.md" "$DEST/RESULTS_RAW.md"
          cp "$RUNNER_TEMP/glv-msolve-all-52.zip" "$DEST/glv-msolve-all-52.zip"
          tar -C "$SRC" -czf "$DEST/raw_shards.tar.gz" raw_shards

          python3 - <<'PY'
          import hashlib, json, os, pathlib
          dest = pathlib.Path("archive/untrusted_intake/GLV-C6-RELATIVE-NORM-2026-08-11/msolve_52")
          summary = json.loads((dest / "combined_summary.json").read_text())
          rows = summary.get("rows", [])
          assert summary.get("expected") == 52, summary.get("expected")
          assert summary.get("observed") == 52, summary.get("observed")
          assert len(rows) == 52, len(rows)
          assert all(int(row["exit_code"]) == 0 for row in rows)
          provenance = {
              "schema_version": "1.0",
              "status": "untrusted_non_executable_bounded_evidence",
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_head_sha": os.environ["WORKFLOW_HEAD_SHA"],
              "msolve_version": "0.10.1",
              "threads": 4,
              "flags": ["-v", "2", "-g", "1"],
              "input_archive_sha256": os.environ["INPUT_ARCHIVE_SHA256"],
              "actions_artifact_id": int(os.environ["ARTIFACT_ID"]),
              "actions_artifact_sha256": os.environ["ARTIFACT_SHA256"],
              "systems_expected": 52,
              "systems_observed": 52,
              "timeouts": 0,
              "nonzero_exits": 0,
              "scope": {
                  "toy_only": True,
                  "real_world_key_material": False,
                  "secp256k1_dlog_target": False,
                  "route_promotion": False,
                  "experiment_authorization": False
              }
          }
          (dest / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          files = sorted(p for p in dest.iterdir() if p.name != "SHA256SUMS")
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}" for p in files]
          (dest / "SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY

          cat > "$DEST/README.md" <<'EOF'
          # Permanent msolve 52-system evidence

          This directory is the permanent repository copy of the bounded F4/DRL comparison recorded in `../msolve_52_bounded_result.md`.

          It preserves both positive and negative information:

          - the direct `q_c6_orbit` representation won the tested F4 matrix comparisons for every `k >= 2` fixture;
          - it paid a startup penalty at `k = 1`;
          - the run establishes no asymptotic exponent change and no secp256k1 discrete-log recovery;
          - the full raw shard logs, aggregate tables, exact provenance and cryptographic hashes are retained so later work can replay or contradict this result without losing history.

          Files:

          - `combined_summary.json` and `.csv`: all 52 normalized outcomes;
          - `RESULTS_RAW.md`: aggregator output from the completed workflow;
          - `raw_shards.tar.gz`: every per-system stdout, timing record, exit code and extracted metric line;
          - `glv-msolve-all-52.zip`: byte-identical GitHub Actions artifact;
          - `provenance.json`: frozen execution identity and scope boundary;
          - `SHA256SUMS`: hashes of every retained file.

          The data remain quarantined under `archive/untrusted_intake/`. They are evidence for review, not an authorized Research Engine outcome.
          EOF
          sed -i 's/^          //' "$DEST/README.md"
          sha256sum -c "$DEST/SHA256SUMS"

      - name: Commit permanent evidence to the intake branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "KeyAI Evidence Bot"
          git config user.email "bekzaddzhanpolatov@gmail.com"
          git add archive/untrusted_intake/GLV-C6-RELATIVE-NORM-2026-08-11/msolve_52
          git diff --cached --check
          git commit -m "research: persist raw msolve 52-system evidence"
          git push origin HEAD:${GITHUB_REF_NAME}
