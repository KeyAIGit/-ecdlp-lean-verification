name: Shifted Legendre classical recovery

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'experiments/parity_lift_000/shifted_legendre_classical_recovery.py'
      - 'Ecdlp/Proved/ShiftedLegendreClassicalRecovery.lean'
      - '.github/workflows/shifted-legendre-classical-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact shifted-Legendre replay
        run: |
          python3 experiments/parity_lift_000/shifted_legendre_classical_recovery.py \
            --out /tmp/shifted_legendre_classical_recovery_results.json \
            > /tmp/shifted-legendre-classical-recovery.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/shifted_legendre_classical_recovery_results.json').read_text())
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 6
          assert aggregate['total_correlation_checks'] == 10662
          assert aggregate['total_hamming_checks'] == 9660
          assert aggregate['total_affine_reduction_checks'] == 19516
          assert aggregate['all_shift_signatures_unique']
          assert aggregate['all_nonzero_correlations_minus_one']
          assert aggregate['all_affine_queries_reduce_to_shift']
          assert secp['bit_length'] == 256
          assert secp['ceil_sqrt_n'] == 2**128
          assert secp['information_theoretic_fingerprint_queries'] == 524
          assert secp['full_signature_table_entries'] > secp['ceil_sqrt_n']
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/ShiftedLegendreClassicalRecovery.lean; then
            echo '::error::Shifted-Legendre theorem contains sorry'
            exit 1
          fi

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            for attempt in 1 2 3 4; do
              if sh /tmp/elan-init.sh -y --default-toolchain none; then
                installed=1
                echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
                break
              fi
              sleep $((attempt * 3))
            done
          fi
          if [ "$installed" = 0 ]; then
            echo 'elan unavailable; downloading the pinned Lean distribution directly'
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check shifted-Legendre identities
        run: lake build Ecdlp.Proved.ShiftedLegendreClassicalRecovery

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: shifted-legendre-classical-recovery-results
          path: |
            /tmp/shifted_legendre_classical_recovery_results.json
            /tmp/shifted-legendre-classical-recovery.log
          retention-days: 90
