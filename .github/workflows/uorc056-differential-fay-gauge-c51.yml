name: UORC056 differential Fay gauge C51

on:
  push:
    branches:
      - research/uorc056-differential-fay-gauge-c51
    paths:
      - "experiments/parity_lift_000/uorc056_c51_differential_core.py"
      - "experiments/parity_lift_000/uorc056_c51_differential_analysis.py"
      - "experiments/parity_lift_000/uorc056_differential_fay_gauge_c51.py"
      - "experiments/parity_lift_000/test_uorc056_differential_fay_gauge_c51.py"
      - "Ecdlp/Proved/Uorc056DifferentialFayGauge.lean"
      - "notes/UORC056_DIFFERENTIAL_FAY_GAUGE_C51.md"
      - ".github/workflows/uorc056-differential-fay-gauge-c51.yml"
  pull_request:
    paths:
      - "experiments/parity_lift_000/uorc056_c51_differential_core.py"
      - "experiments/parity_lift_000/uorc056_c51_differential_analysis.py"
      - "experiments/parity_lift_000/uorc056_differential_fay_gauge_c51.py"
      - "experiments/parity_lift_000/test_uorc056_differential_fay_gauge_c51.py"
      - "Ecdlp/Proved/Uorc056DifferentialFayGauge.lean"
      - "notes/UORC056_DIFFERENTIAL_FAY_GAUGE_C51.md"
      - ".github/workflows/uorc056-differential-fay-gauge-c51.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and replay C51 once
        run: |
          python -m py_compile \
            experiments/parity_lift_000/uorc056_c51_differential_core.py \
            experiments/parity_lift_000/uorc056_c51_differential_analysis.py \
            experiments/parity_lift_000/uorc056_differential_fay_gauge_c51.py \
            experiments/parity_lift_000/test_uorc056_differential_fay_gauge_c51.py
          PYTHONPATH=experiments/parity_lift_000 python \
            experiments/parity_lift_000/uorc056_differential_fay_gauge_c51.py \
            --out /tmp/uorc056_differential_fay_gauge_c51.json

      - name: Test emitted exact certificate
        env:
          UORC056_C51_PAYLOAD: /tmp/uorc056_differential_fay_gauge_c51.json
        run: |
          PYTHONPATH=experiments/parity_lift_000 python -m unittest -v \
            experiments/parity_lift_000/test_uorc056_differential_fay_gauge_c51.py

      - name: Check machine-readable C51 boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/uorc056_differential_fay_gauge_c51.json").read_text()
          )
          assert data["profile_id"] == "UORC-056-DIFFERENTIAL-FAY-GAUGE-C51"
          aggregate = data["aggregate"]
          assert aggregate["curves"] == 12
          assert aggregate["frozen"] == 4
          assert aggregate["heldout"] == 8
          assert aggregate["torsion_jet_rows"] == 4392
          assert aggregate["first_derivative_checks"] == 4368
          assert aggregate["second_derivative_checks"] == 4368
          assert aggregate["third_derivative_checks"] == 4368
          assert aggregate["eta_cancellation_checks"] == 73500
          assert aggregate["all_affine_character_survivors_zero"]
          assert aggregate["all_H_have_mixed_parity_collisions"]
          assert aggregate["all_cm_quotients_dense"]
          assert aggregate["max_cm_degree_deficit_from_interpolation_ceiling"] == 9
          assert aggregate["errors"] == 0
          assert all(all(curve["identities"].values()) for curve in data["curves"])
          secp = data["secp256k1"]
          assert secp["chi_ward_a"] == 1
          assert secp["chi_ward_b"] == -1
          decision = data["decision"]
          assert decision["fast_regularized_torsion_jet_found"]
          assert decision["fast_anchor_mixed_net_derivative_found"]
          assert not decision["first_differential_exposes_integer_lift"]
          assert not decision["higher_differentials_break_section_gauge"]
          assert not decision["cheap_parity_decoder_found"]
          assert not decision["parity_oracle_found"]
          assert not decision["sub_sqrt_ecdlp_found"]
          assert len(data["digest"]) == 64
          PY

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
            fi
          fi
          if [ "$installed" = 0 ]; then
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check C51 integer algebra
        run: |
          lake build Ecdlp.Proved.Uorc056DifferentialFayGauge
          lake env lean Ecdlp/Proved/Uorc056DifferentialFayGauge.lean

      - name: Upload C51 certificate
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-differential-fay-gauge-c51
          path: /tmp/uorc056_differential_fay_gauge_c51.json
          retention-days: 90
