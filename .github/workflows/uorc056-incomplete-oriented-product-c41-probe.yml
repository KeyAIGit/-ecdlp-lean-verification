name: UORC056 incomplete oriented product C41

on:
  push:
    branches:
      - research/uorc056-incomplete-oriented-product-c41
    paths:
      - 'experiments/parity_lift_000/uorc056_incomplete_oriented_product_c41_probe.py'
      - 'experiments/parity_lift_000/uorc056_incomplete_oriented_product_c41.py'
      - 'experiments/parity_lift_000/test_uorc056_incomplete_oriented_product_c41.py'
      - 'Ecdlp/Proved/Uorc056IncompleteOrientedProduct.lean'
      - 'notes/UORC056_INCOMPLETE_ORIENTED_PRODUCT_C41.md'
      - 'notes/UORC056_C_TRACK_LINEAGE_C41.json'
      - '.github/workflows/uorc056-incomplete-oriented-product-c41-probe.yml'
  pull_request:
    branches:
      - research/uorc056-prime-kernel-norm-rigidity-c40
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile, test and replay C41
        run: |
          python -m py_compile \
            experiments/parity_lift_000/uorc056_incomplete_oriented_product_c41_probe.py \
            experiments/parity_lift_000/uorc056_incomplete_oriented_product_c41.py \
            experiments/parity_lift_000/test_uorc056_incomplete_oriented_product_c41.py
          PYTHONPATH=experiments/parity_lift_000 python -m unittest -v \
            experiments/parity_lift_000/test_uorc056_incomplete_oriented_product_c41.py
          PYTHONPATH=experiments/parity_lift_000 python \
            experiments/parity_lift_000/uorc056_incomplete_oriented_product_c41.py \
            --out /tmp/uorc056_incomplete_oriented_product_c41_result.json

      - name: Check machine-readable boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(
              '/tmp/uorc056_incomplete_oriented_product_c41_result.json'
          ).read_text())
          assert result['profile_id'] == 'UORC-056-INCOMPLETE-ORIENTED-PRODUCT-C41'
          aggregate = result['aggregate']
          assert aggregate['curves'] == 5
          assert aggregate['declared_polynomials'] == 25
          assert aggregate['all_declared_polynomials_indecomposable']
          assert aggregate['all_coefficient_recurrences_maximal_on_finite_window']
          assert aggregate['all_nonnegation_bivariate_relations_dimension_forced']
          assert aggregate['all_negation_relations_explained_by_swap_involution']
          assert aggregate['all_rational_transitions_dimension_forced']
          assert aggregate['errors'] == 0
          secp = result['secp256k1_dimension_frontier']
          assert secp['first_general_bivariate_interpolation_degree'] == 481231938336009023090067544955250113852
          assert secp['first_swap_symmetric_interpolation_degree'] == 481231938336009023090067544955250113852
          assert secp['degree_bit_length'] == 129
          assert secp['rational_degree_bit_length'] == 255
          decision = result['decision']
          assert decision['declared_composition_recurrence_transition_grammars_closed_on_frozen_corpus']
          assert not decision['incomplete_oriented_product_evaluator_found']
          assert not decision['parity_oracle_found']
          assert not decision['sub_sqrt_ecdlp_found']
          assert len(result['digest']) == 64
          PY

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
            fi
          fi
          if [ "$installed" = 0 ]; then
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Kernel-check C41 dimension arithmetic
        run: |
          lake exe cache get
          lake build Ecdlp.Proved.Uorc056IncompleteOrientedProduct
          lake env lean Ecdlp/Proved/Uorc056IncompleteOrientedProduct.lean

      - name: Upload C41 certificate
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-incomplete-oriented-product-c41
          path: /tmp/uorc056_incomplete_oriented_product_c41_result.json
          retention-days: 90
