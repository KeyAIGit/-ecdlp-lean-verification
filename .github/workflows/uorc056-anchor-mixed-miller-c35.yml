name: UORC056 anchor mixed Miller C35

on:
  push:
    branches:
      - research/uorc056-anchor-mixed-miller-c35
    paths:
      - 'experiments/parity_lift_000/uorc056_anchor_mixed_miller_c35.py'
      - 'experiments/parity_lift_000/uorc056_shifted_miller_core.py'
      - 'experiments/parity_lift_000/uorc056_shifted_miller_eval.py'
      - 'experiments/parity_lift_000/uorc056_shifted_miller_curve_screen.py'
      - 'experiments/parity_lift_000/test_uorc056_anchor_mixed_miller_c35.py'
      - 'experiments/parity_lift_000/uorc056_anchor_mixed_miller_c35_result.json'
      - 'Ecdlp/Proved/Uorc056AnchorMixedMiller.lean'
      - 'notes/UORC056_ANCHOR_MIXED_MILLER_C35.md'
      - 'archive/untrusted_intake/parity_lift_000/UORC056_C_TRACK_LINEAGE_C35.json'
      - '.github/workflows/uorc056-anchor-mixed-miller-c35.yml'
  pull_request:
    branches:
      - research/uorc056-dynamic-carry-aggregation-c34
    paths:
      - 'experiments/parity_lift_000/uorc056_anchor_mixed_miller_c35.py'
      - 'experiments/parity_lift_000/uorc056_shifted_miller_core.py'
      - 'experiments/parity_lift_000/uorc056_shifted_miller_eval.py'
      - 'experiments/parity_lift_000/uorc056_shifted_miller_curve_screen.py'
      - 'experiments/parity_lift_000/test_uorc056_anchor_mixed_miller_c35.py'
      - 'experiments/parity_lift_000/uorc056_anchor_mixed_miller_c35_result.json'
      - 'Ecdlp/Proved/Uorc056AnchorMixedMiller.lean'
      - 'notes/UORC056_ANCHOR_MIXED_MILLER_C35.md'
      - 'archive/untrusted_intake/parity_lift_000/UORC056_C_TRACK_LINEAGE_C35.json'
      - '.github/workflows/uorc056-anchor-mixed-miller-c35.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile, test and replay C35
        run: |
          python -m py_compile \
            experiments/parity_lift_000/uorc056_shifted_miller_core.py \
            experiments/parity_lift_000/uorc056_shifted_miller_eval.py \
            experiments/parity_lift_000/uorc056_shifted_miller_curve_screen.py \
            experiments/parity_lift_000/uorc056_anchor_mixed_miller_c35.py \
            experiments/parity_lift_000/test_uorc056_anchor_mixed_miller_c35.py
          PYTHONPATH=experiments/parity_lift_000 python -m unittest -v \
            experiments/parity_lift_000/test_uorc056_anchor_mixed_miller_c35.py
          PYTHONPATH=experiments/parity_lift_000 python \
            experiments/parity_lift_000/uorc056_anchor_mixed_miller_c35.py \
            --check \
            --out /tmp/uorc056_anchor_mixed_miller_c35_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          committed = json.loads(Path(
              'experiments/parity_lift_000/uorc056_anchor_mixed_miller_c35_result.json'
          ).read_text())
          replayed = json.loads(Path(
              '/tmp/uorc056_anchor_mixed_miller_c35_result.json'
          ).read_text())
          assert committed == replayed
          PY

      - name: Check machine-readable decision boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path(
              '/tmp/uorc056_anchor_mixed_miller_c35_result.json'
          ).read_text())
          assert result['profile_id'] == 'UORC-056-ANCHOR-MIXED-MILLER-C35'
          aggregate = result['aggregate']
          assert aggregate['twist_shifts'] == 520
          assert aggregate['shift_query_cases'] == 54192
          assert aggregate['normalized_shift_gauge_checks'] == 53672
          assert aggregate['torus_kummer_checks'] == 54192
          assert aggregate['miller_loop_comparisons'] == 438
          assert aggregate['quadratic_character_shift_survivors'] == 0
          assert aggregate['low_order_three_carry_uniform_survivors'] == 0
          assert aggregate['errors'] == 0
          decision = result['decision']
          assert decision['compact_shifted_miller_state_found']
          assert decision['shifted_state_publicly_evaluable_by_miller_chain']
          assert not decision['independent_orientation_channels_from_twist_shifts_found']
          assert decision['torus_component_collapses_to_centered_kummer']
          assert not decision['parity_oracle_found']
          assert not decision['sub_sqrt_ecdlp_found']
          assert len(result['digest']) == 64
          PY

      - name: Install Lean toolchain
        run: |
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
            fi
          fi
          if [ "$installed" = 0 ]; then
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi

      - name: Kernel-check C35 algebra and secp arithmetic
        run: |
          lake exe cache get
          lake build Ecdlp.Proved.Uorc056AnchorMixedMiller
          lake env lean Ecdlp/Proved/Uorc056AnchorMixedMiller.lean

      - name: Upload C35 certificate
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-anchor-mixed-miller-c35
          path: /tmp/uorc056_anchor_mixed_miller_c35_result.json
          retention-days: 90
