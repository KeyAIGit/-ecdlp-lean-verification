name: UORC056 H-RPCX rational semiconjugacy barrier V7

on:
  push:
    branches: [research/uorc056-hrpcx-linear-shift-barrier]
    paths:
      - 'experiments/parity_lift_000/uorc056_hrpcx_autonomous_linear_state_barrier_v6.py'
      - 'experiments/parity_lift_000/uorc056_hrpcx_rational_semiconjugacy_barrier_v7.py'
      - 'experiments/parity_lift_000/uorc056_hrpcx_rational_semiconjugacy_barrier_v7_status.json'
      - 'notes/reviews/UORC056_HRPCX_RATIONAL_SEMICONJUGACY_BARRIER_V7.md'
      - '.github/workflows/uorc056-hrpcx-rational-semiconjugacy-v7.yml'
  pull_request:
    branches: [research/uorc056-poly-compression-existence]
    paths:
      - 'experiments/parity_lift_000/uorc056_hrpcx_autonomous_linear_state_barrier_v6.py'
      - 'experiments/parity_lift_000/uorc056_hrpcx_rational_semiconjugacy_barrier_v7.py'
      - 'experiments/parity_lift_000/uorc056_hrpcx_rational_semiconjugacy_barrier_v7_status.json'
      - 'notes/reviews/UORC056_HRPCX_RATIONAL_SEMICONJUGACY_BARRIER_V7.md'
      - '.github/workflows/uorc056-hrpcx-rational-semiconjugacy-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Replay secp256k1 degree tradeoff
        run: |
          python -m py_compile experiments/parity_lift_000/uorc056_hrpcx_rational_semiconjugacy_barrier_v7.py
          python experiments/parity_lift_000/uorc056_hrpcx_rational_semiconjugacy_barrier_v7.py --out /tmp/uorc056_hrpcx_rational_semiconjugacy_barrier_v7_results.json
      - name: Check exact claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/uorc056_hrpcx_rational_semiconjugacy_barrier_v7_results.json').read_text())
          status = json.loads(Path('experiments/parity_lift_000/uorc056_hrpcx_rational_semiconjugacy_barrier_v7_status.json').read_text())

          assert result['profile_id'] == status['profile_id']
          assert result['status'] == status['status']
          assert result['consistency_checks'] == {
              'v6_embedding_degree_matches': True,
              'all_thresholds_satisfy_tradeoff': True,
              'all_predecessors_fail_tradeoff': True,
          }
          secp = result['secp256k1']
          assert secp['embedding_degree_K'] == status['secp256k1']['ord_n_p']
          assert secp['mobius_extension_degree_lower_bound'] == status['secp256k1']['mobius_extension_degree_at_least']
          thresholds = {row['update_degree_D']: row for row in secp['nonlinear_degree_thresholds']}
          assert thresholds[2]['minimum_state_map_degree_delta'] == status['secp256k1']['degree_two_minimum_delta']
          assert thresholds[3]['minimum_state_map_degree_delta'] == status['secp256k1']['degree_three_minimum_delta']
          assert result['decision'] == status['decision']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uorc056-hrpcx-rational-semiconjugacy-v7
          path: /tmp/uorc056_hrpcx_rational_semiconjugacy_barrier_v7_results.json
          retention-days: 90
