name: UORC056 Pell continued-fraction boundary

on:
  push:
    branches:
      - research/uorc056-kummer-factor
    paths:
      - 'archive/untrusted_intake/parity_lift_000/UORC056_PELL_CONTINUED_FRACTION_B16.md'
      - 'experiments/parity_lift_000/uorc056_pell_continued_fraction.py'
      - 'Ecdlp/Proved/PellContinuedFractionBoundary.lean'
      - '.github/workflows/uorc056-pell-continued-fraction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact frozen Euclidean replay
        run: |
          python3 experiments/parity_lift_000/uorc056_pell_continued_fraction.py \
            --out /tmp/uorc056_pell_continued_fraction_results.json \
            > /tmp/uorc056-pell-continued-fraction.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/uorc056_pell_continued_fraction_results.json').read_text()
          )
          aggregate = data['aggregate']
          secp = data['secp256k1']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(secp, indent=2))
          assert aggregate['cases'] == 10
          assert aggregate['total_principal_numerator_degree'] == 277
          assert aggregate['total_gcd_degree'] == 3
          assert aggregate['total_euclidean_quotients'] == 261
          assert aggregate['total_euclidean_quotient_degree'] == 274
          assert aggregate['total_materialized_quotient_coefficient_slots'] == 535
          assert aggregate['total_degree_one_quotients'] == 248
          assert aggregate['all_telescoping_identities_exact']
          assert aggregate['largest_order'] == 313
          assert aggregate['largest_quotient_count'] == 76
          assert secp['n_mod_8'] == 1
          assert secp['reduced_degree_lower_bound_ge_2_pow_253']
          assert not secp['standard_explicit_continued_fraction_sub_sqrt']
          assert not secp['transposed_single_value_factor_evaluation_closed']
          assert secp['central_target'] == 'UNIFORM-ORIENTED-ROOT-CIRCUIT-056'
          assert not secp['public_parity_oracle_found']
          assert not secp['sub_sqrt_ecdlp_found']
          PY

      - name: Kernel-check scoped Lean arithmetic
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit)([[:space:]]|$)' \
              Ecdlp/Proved/PellContinuedFractionBoundary.lean; then
            echo '::error::Lean boundary contains sorry or admit'
            exit 1
          fi
          installed=0
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh; then
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              export PATH="$HOME/.elan/bin:$PATH"
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
            fi
          fi
          if [ "$installed" = 0 ]; then
            curl --retry 8 --retry-delay 3 --retry-all-errors -fsSL \
              https://releases.lean-lang.org/lean4/v4.31.0/lean-4.31.0-linux.tar.zst \
              -o /tmp/lean.tar.zst
            mkdir -p /tmp/lean-dist
            tar --zstd -xf /tmp/lean.tar.zst -C /tmp/lean-dist
            export PATH="/tmp/lean-dist/lean-4.31.0-linux/bin:$PATH"
            echo "/tmp/lean-dist/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
          fi
          lake exe cache get
          lake build Ecdlp.Proved.PellContinuedFractionBoundary

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-pell-continued-fraction-results
          path: |
            /tmp/uorc056_pell_continued_fraction_results.json
            /tmp/uorc056-pell-continued-fraction.log
          retention-days: 90
