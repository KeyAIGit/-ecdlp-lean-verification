name: UORC056 asymmetric sparse-resultant C26

on:
  push:
    branches:
      - research/uorc056-asymmetric-resultant-c26
    paths:
      - 'experiments/parity_lift_000/uorc056_sparse_circulant_symmetry.py'
      - 'experiments/parity_lift_000/uorc056_asymmetric_resultant_audit.py'
      - 'Ecdlp/Proved/Uorc056SparseCirculant.lean'
      - 'Ecdlp/Proved/Uorc056AsymmetricResultant.lean'
      - 'archive/untrusted_intake/parity_lift_000/UORC056_SPARSE_CIRCULANT_PARITY_C25.md'
      - 'archive/untrusted_intake/parity_lift_000/UORC056_ASYMMETRIC_SPARSE_RESULTANT_C26.md'
      - 'archive/untrusted_intake/parity_lift_000/UORC056_PUBLIC_Q_RESULTANT_C27_PROMPT.md'
      - '.github/workflows/uorc056-asymmetric-resultant-c26.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compile and replay C26
        run: |
          set -o pipefail
          python3 -m py_compile \
            experiments/parity_lift_000/uorc056_sparse_circulant_symmetry.py \
            experiments/parity_lift_000/uorc056_asymmetric_resultant_audit.py
          python3 experiments/parity_lift_000/uorc056_asymmetric_resultant_audit.py \
            --out /tmp/uorc056_asymmetric_resultant_audit_result.json \
            | tee /tmp/uorc056-asymmetric-resultant-c26.log

      - name: Check C26 scope and exact structural counts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('/tmp/uorc056_asymmetric_resultant_audit_result.json').read_text()
          )
          assert len(result['digest']) == 64
          assert len(result['source_certificates']) == 2
          assert all(row['markers_verified'] for row in result['source_certificates'])

          classification = result['projective_stabilizer_classification']
          assert len(classification['fields']) == 10
          assert classification['normalized_pairwise_distinct_triples_checked'] == 4752
          assert classification['nontrivial_projective_lines_found'] == 12
          assert classification['classification_exact_on_screen']

          projective = result['projective_cubic_screen']
          assert projective['orders_checked'] == 29
          assert projective['exact_projective_phase_checks'] == 58
          assert projective['opposite_parity_orbit_checks'] == 58
          assert projective['quadratic_character_collisions'] == 58
          assert projective['zero_status_collisions'] == 58
          assert projective['quadratic_character_blocked_for_projective_cubic_family']
          assert projective['zero_nonzero_extraction_blocked_for_projective_cubic_family']
          assert not projective['exact_value_extraction_blocked_by_projective_phase_alone']
          assert all(row['omega_is_square'] for row in projective['orders'])

          degree = result['one_step_degree_boundary']
          assert degree['orders_checked'] == 32
          assert degree['all_counting_bounds_verified']
          assert degree['secp256k1_one_step_reduced_degree_lower_bound'] == \
              '19298681539552699237261830834781317975472927379845817397100860523586360249057'
          assert degree['secp256k1_lower_bound_bits'] == 254
          assert not degree['unrestricted_sparse_resultant_lower_bound']

          fixed = result['fixed_label_screen']
          assert fixed['discovery_orders'] == [13,17,19,23,29,31,37,41]
          assert fixed['held_out_orders'] == [43,47,53,59,61,67,71,73,79,83,89,97]
          assert fixed['character_orders'] == [2,3,4,5,6,8,10,12]
          assert fixed['candidate_coefficients'] == 54
          assert fixed['candidate_extraction_pairs'] == 540
          assert fixed['survivors_by_extraction'] == {}
          assert len(fixed['bounded_variant_library']) == 12
          assert fixed['bounded_ordered_ratio_pairs'] == 132
          assert fixed['bounded_ratio_survivors'] == 0
          assert fixed['all_fixed_small_candidates_rejected_on_discovery_and_held_out']
          assert fixed['finite_screen_only']
          assert not fixed['fixed_label_family_universally_blocked']

          secp = result['secp256k1']
          assert secp['n_mod_3'] == 1
          assert secp['n_mod_4'] == 1
          assert secp['lower_bound_bits'] == 254
          assert secp['projective_cubic_coefficients_available_from_public_GLV_cube_root']
          assert secp['projective_cubic_quadratic_character_blocked']
          assert not secp['projective_cubic_exact_value_blocked']
          assert not secp['a_eq_b_fixed_label_universally_blocked']
          assert not secp['fully_asymmetric_fixed_label_universally_blocked']
          assert secp['numeric_k_control_is_not_public_Q_control']
          assert secp['linear_regular_representation_public_Q_realization_known']
          assert not secp['sublinear_public_Q_control_flow_found']

          aggregate = result['aggregate']
          assert aggregate['projective_stabilizer_classification_verified']
          assert aggregate['projective_cubic_phase_law_verified']
          assert aggregate['projective_cubic_quadratic_character_blocked']
          assert aggregate['projective_cubic_zero_status_blocked']
          assert not aggregate['projective_cubic_exact_value_blocked']
          assert aggregate['one_step_Mobius_reparameterization_worst_case_linear']
          assert aggregate['fixed_small_a_eq_b_exact_value_survivors'] == 0
          assert aggregate['fixed_small_fully_asymmetric_exact_value_survivors'] == 0
          assert aggregate['fixed_small_character_survivors'] == 0
          assert aggregate['bounded_variant_ratio_survivors'] == 0
          assert not aggregate['fixed_small_screens_are_universal_proofs']
          assert not aggregate['a_eq_b_fixed_label_collision_proved']
          assert not aggregate['fully_asymmetric_fixed_label_collision_proved']
          assert not aggregate['sublinear_one_step_Mobius_resultant_representation_found']
          assert not aggregate['sublinear_numeric_k_resultant_algorithm_found']
          assert not aggregate['sublinear_public_Q_control_flow_found']
          assert not aggregate['exact_Hilbert90_branch_bridge_found']
          assert not aggregate['complete_cost_gate_passed']
          assert not aggregate['compact_branch_odd_evaluator_found']
          assert not aggregate['sub_sqrt_evaluator_found']
          assert not aggregate['parity_oracle_found']
          assert not aggregate['sub_sqrt_ecdlp_found']
          PY

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Check C25-C26 Lean certificates
        run: |
          lake build Ecdlp.Proved.Uorc056SparseCirculant
          lake build Ecdlp.Proved.Uorc056AsymmetricResultant
          lake env lean Ecdlp/Proved/Uorc056AsymmetricResultant.lean

      - name: Upload C26 audit output
        uses: actions/upload-artifact@v4
        with:
          name: uorc056-asymmetric-resultant-c26
          path: |
            /tmp/uorc056_asymmetric_resultant_audit_result.json
            /tmp/uorc056-asymmetric-resultant-c26.log
          retention-days: 90
