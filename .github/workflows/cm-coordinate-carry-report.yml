name: CM coordinate carry decision report

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - experiments/parity_lift_000/cm_coordinate_carry_screen.py
      - .github/workflows/cm-coordinate-carry-report.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run screen and build scale-qualified decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 experiments/parity_lift_000/cm_coordinate_carry_screen.py \
            --out cm_coordinate_carry_results.json > /tmp/cm-coordinate.log
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          ALPHA = 0.05
          SCALE_ORDER_FLOOR = 271

          data = json.loads(Path('cm_coordinate_carry_results.json').read_text())
          agg = data['aggregate']
          cases = data['cases']
          large = [case for case in cases if case['order'] >= SCALE_ORDER_FLOOR]

          def strict_tail_add_one(case, prefix):
              trials = int(case[f'{prefix}_null_trials'])
              if trials <= 0:
                  return 1.0
              percentile = float(case[f'{prefix}_empirical_null_percentile'])
              count_le = min(trials, max(0, round(percentile * trials)))
              return (trials - count_le + 1) / (trials + 1)

          def holm_passes(rows):
              rows = sorted(rows)
              passes = []
              total = len(rows)
              for index, (p_value, order) in enumerate(rows):
                  if p_value > ALPHA / (total - index):
                      break
                  passes.append(order)
              return passes

          exact_orders = sorted(
              case['order'] for case in cases if case['carry_exact_decoder']
          )
          exact_large = [
              order for order in exact_orders if order >= SCALE_ORDER_FLOOR
          ]
          carry_rows = [
              (strict_tail_add_one(case, 'carry'), case['order'])
              for case in large
          ]
          r3_rows = [
              (strict_tail_add_one(case, 'r3'), case['order'])
              for case in large
              if case['r3_null_trials'] > 0
          ]
          carry_holm = holm_passes(carry_rows)
          r3_holm = holm_passes(r3_rows)
          q95_orders = sorted(
              case['order']
              for case in large
              if case['carry_best_accuracy'] > case['carry_null_q95']
          )
          positive = bool(exact_large or carry_holm or r3_holm)
          fwer = 1 - 0.95 ** len(cases)

          print('## CM-COORDINATE-CARRY-010 corrected scaling decision')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('```json')
          print(json.dumps(agg, indent=2))
          print('```')
          print()
          print(f'Exact decoder orders: `{exact_orders}`')
          print(f'Scale-qualified exact decoder orders: `{exact_large}`')
          print(f'Scale-qualified nominal q95 exceedances: `{q95_orders}`')
          print(f'Holm-Bonferroni carry passes: `{carry_holm}`')
          print(f'Holm-Bonferroni R3 passes: `{r3_holm}`')
          print(f'Chance of at least one nominal q95 exceedance across 15 cases: `{fwer:.6f}`')
          print()
          print('Largest frozen cases:')
          print()
          print('| order | carry best | carry null 95% | candidate | R3 best | R3 null 95% |')
          print('|---:|---:|---:|---|---:|---:|')
          for case in sorted(cases, key=lambda row: row['order'])[-6:]:
              print(
                  f"| {case['order']} | {case['carry_best_accuracy']:.6f} | "
                  f"{case['carry_null_q95']:.6f} | `{case['carry_best_candidate']}` | "
                  f"{case['r3_best_accuracy']:.6f} | {case['r3_null_q95']:.6f} |"
              )
          print()
          if positive:
              print('Decision: **scale-qualified follow-up required**. A large-order exact or multiple-testing-corrected gate fired. This is not yet a secp256k1 claim.')
          else:
              print('Decision: **no admitted scaling signal**. The only exact carry decoder is the order-19 resonance; no decoder at order >=271 and no Holm-Bonferroni correlation pass were found.')
          PY
          gh api \
            --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: cm-coordinate-carry-decision
          path: cm_coordinate_carry_results.json
