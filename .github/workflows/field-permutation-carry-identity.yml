name: Field permutation carry identity

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - experiments/parity_lift_000/field_permutation_carry_identity.py
      - experiments/parity_lift_000/public_spectral_decoder_screen_v2.py
      - Ecdlp/Proved/FieldPermutationCarryIdentity.lean
      - archive/untrusted_intake/parity_lift_000/FIELD_PERMUTATION_CARRY_IDENTITY_017.md
      - .github/workflows/field-permutation-carry-identity.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: field-permutation-carry-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install numerical dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Replay normalization-aware public spectral census
        run: |
          python3 experiments/parity_lift_000/public_spectral_decoder_screen_v2.py \
            --out /tmp/public_spectral_decoder_v2_results.json \
            > /tmp/public-spectral-v2.log
          tail -n 30 /tmp/public-spectral-v2.log

      - name: Verify exact field permutation carry identity
        run: |
          python3 experiments/parity_lift_000/field_permutation_carry_identity.py \
            --spectral-results /tmp/public_spectral_decoder_v2_results.json \
            --out /tmp/field_permutation_carry_identity_results.json \
            > /tmp/field-permutation.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('/tmp/field_permutation_carry_identity_results.json').read_text()
          )
          print(json.dumps(data['aggregate'], indent=2))
          print(json.dumps(data['selected_large_summary'], indent=2))
          agg = data['aggregate']
          if agg['maximum_fourier_decimation_error'] > 1e-10:
              raise SystemExit('field Fourier decimation identity failed')
          if agg['maximum_l1_equality_error'] > 1e-10:
              raise SystemExit('field Fourier L1 equality failed')
          if agg['maximum_coefficient_equality_error'] > 1e-10:
              raise SystemExit('maximum coefficient equality failed')
          if agg['maximum_product_convolution_error'] > 1e-9:
              raise SystemExit('product-convolution identity failed')
          if not agg['all_selected_large_candidates_below_inverse_log']:
              raise SystemExit('field-permutation mixed candidate crossed inverse-log gate')
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/FieldPermutationCarryIdentity.lean; then
            echo "::error::Field permutation carry identity contains sorry"
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check field permutation arithmetic
        run: lake build Ecdlp.Proved.FieldPermutationCarryIdentity

      - name: Post exact identity to research PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path('/tmp/field_permutation_carry_identity_results.json').read_text()
          )
          agg = data['aggregate']
          summary = data['selected_large_summary']
          print('## FIELD-PERMUTATION-CARRY-IDENTITY-017')
          print()
          print(f"Commit: `{os.environ['GITHUB_SHA']}`")
          print()
          print('Exact identity:')
          print()
          print('```text')
          print('O_beta(x) = -C_beta((beta-1)*x)')
          print('O_hat(a)  = -C_hat(a*(beta-1)^(-1))')
          print('```')
          print()
          print('```json')
          print(json.dumps(agg, indent=2))
          print('```')
          print()
          print('| candidate | largest-order coefficient | max coefficient*sqrt(n) | cases >= 1/log(n) | conditional bound |')
          print('|---|---:|---:|---:|---|')
          for name in (
              'field_permutation*half_y',
              'field_permutation*chi_y',
              'field_carry_x*field_permutation*half_y',
          ):
              row = summary[name]
              print(
                  f"| `{name}` | {row['largest_order_coefficient']:.8f} | "
                  f"{row['maximum_coefficient_times_sqrt_order']:.6f} | "
                  f"{row['cases_ge_inverse_log']} | `{row['conditional_bound']}` |"
              )
          print()
          print('Decision: **the field permutation orientation is exactly a publicly scaled field carry. It is not a new observable class, and its mixed-y products inherit the package-016 square-root barriers.**')
          print()
          print('Boundary: the pointwise and field-Fourier identities are exact. Mixed-y complexity bounds remain conditional on the external complete hybrid-sum theorem.')
          PY
          gh api \
            --method POST \
            repos/${GITHUB_REPOSITORY}/issues/365/comments \
            -f body="$(cat /tmp/comment.md)"

      - name: Upload identity artifacts
        uses: actions/upload-artifact@v4
        with:
          name: field-permutation-carry-identity-results
          path: |
            /tmp/public_spectral_decoder_v2_results.json
            /tmp/field_permutation_carry_identity_results.json
          if-no-files-found: error
