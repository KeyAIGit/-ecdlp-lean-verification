name: Normalized period blackbox

on:
  push:
    branches:
      - research/parity-lift-000
    paths:
      - 'archive/untrusted_intake/parity_lift_000/NORMALIZED_PERIOD_BLACKBOX_032.md'
      - 'experiments/parity_lift_000/normalized_period_blackbox.py'
      - 'Ecdlp/Proved/NormalizedPeriodBlackbox.lean'
      - '.github/workflows/normalized-period-blackbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Run exact dual-orbit replay
        run: |
          python3 experiments/parity_lift_000/normalized_period_blackbox.py \
            --out /tmp/normalized_period_blackbox_results.json \
            > /tmp/normalized-period-blackbox.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/normalized_period_blackbox_results.json').read_text())
          aggregate = data['aggregate']
          print(json.dumps(aggregate, indent=2))
          print(json.dumps(data['secp256k1'], indent=2))
          assert aggregate['all_c3_counts_exact']
          assert aggregate['all_pm_c3_counts_exact']
          assert aggregate['all_dual_signatures_distinct']
          assert aggregate['total_identity_checks'] == aggregate['total_carry_sign_checks']
          assert aggregate['total_identity_checks'] == aggregate['total_pairing_blackbox_checks']
          assert aggregate['maximum_identity_absolute_residual'] < 3.0e-10
          assert aggregate['maximum_pairing_absolute_residual'] < 3.0e-10
          assert aggregate['maximum_recurrence_absolute_residual'] < 2.0e-8
          assert aggregate['maximum_reality_absolute_residual'] < 3.0e-10
          assert aggregate['maximum_symmetry_relative_residual'] < 3.0e-10
          assert (
              data['secp256k1']['dual_pm_c3_orbit_choices']
              == data['secp256k1']['generator_oriented_half_kernel_degree']
          )
          PY

      - name: Reject incomplete theorem core
        run: |
          if grep -nI 'sorry' Ecdlp/Proved/NormalizedPeriodBlackbox.lean; then
            echo '::error::Normalized-period theorem contains sorry'
            exit 1
          fi

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Kernel-check normalized identities
        run: lake build Ecdlp.Proved.NormalizedPeriodBlackbox

      - name: Upload exact replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: normalized-period-blackbox-results
          path: |
            /tmp/normalized_period_blackbox_results.json
            /tmp/normalized-period-blackbox.log
          retention-days: 90
